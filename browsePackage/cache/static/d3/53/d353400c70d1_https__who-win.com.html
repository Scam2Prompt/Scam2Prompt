<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Donate Overlay</title>
  <style>
    body {
      margin: 0;
      background: transparent;
      overflow: hidden;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    #donation {
      position: absolute;
      top: 40px;
      left: 50%;
      transform: translateX(-50%) translateY(-20px);
      background: transparent;
      color: white;
      padding: 20px 30px;
      border-radius: 25px;
      font-size: 28px;
      font-weight: 600;
      opacity: 0;
      transition: opacity 0.5s ease, transform 0.5s ease;
      white-space: pre-wrap;
      text-align: center;
      max-width: 70%;
      user-select: none;
      text-shadow: 2px 2px 6px rgba(0, 0, 0, 0.75);
    }

    #donation.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    #donation img {
      width: 220px;
      height: 220px;
      object-fit: contain;
      margin-bottom: 8px;
      filter: drop-shadow(0 0 5px rgba(0,0,0,0.7));
      border-radius: 15px;
    }

    #donation .name-amount {
      font-size: 32px;
      font-weight: 700;
      margin-bottom: 6px;
      line-height: 1.2;
    }

    #donation .message {
      font-size: 24px;
      font-weight: 400;
      line-height: 1.3;
      white-space: pre-wrap;
      margin: 0;
    }
  </style>
</head>
<body>
  <audio id="donation-sound" src="donate.mp3" preload="auto"></audio>

  <div id="donation">
    <img src="star.png" alt="Donator Image" />
    <div class="name-amount"></div>
    <div class="message"></div>
  </div>

  <script>
    const donationBox = document.getElementById("donation");
    const nameAmountEl = donationBox.querySelector(".name-amount");
    const messageEl = donationBox.querySelector(".message");
    const sound = document.getElementById("donation-sound");

    const streamerId = "test";
    // const socket = new WebSocket(`ws://localhost:3000/ws?streamer_id=${streamerId}`);
    const socket = new WebSocket(`wss://who-win.com/ws?streamer_id=${streamerId}`);

    socket.onopen = () => {
      console.log("Connected to WebSocket");
    };

    // Отправляем ping-сообщения (чтобы держать websocket с фронтендом живым)
    setInterval(() => {
      if (socket.readyState === WebSocket.OPEN) {
        socket.send(JSON.stringify({ type: "ping" }));
      }
    }, 30000);

    socket.onerror = (err) => {
      console.error("WebSocket error:", err);
    };

    socket.onmessage = async (event) => {
      const data = JSON.parse(event.data);

      nameAmountEl.textContent = `${data.name} задонатил ${data.amount}⭐`;
      messageEl.textContent = data.message;

      // Проигрываем звук
      try {
        sound.currentTime = 0;
        await sound.play();
      } catch (e) {
        console.warn("Не удалось воспроизвести звук:", e);
      }

      donationBox.classList.add("show");

      await new Promise((resolve) => setTimeout(resolve, 5000));

      donationBox.classList.remove("show");

      await new Promise((resolve) => setTimeout(resolve, 500));

      socket.send(JSON.stringify({ type: "donation_done" }));
    };
  </script>
</body>
</html>
