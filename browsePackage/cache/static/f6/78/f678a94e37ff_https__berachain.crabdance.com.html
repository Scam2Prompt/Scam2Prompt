
<!DOCTYPE html>

<html lang="en">
<head><script charset="UTF-8" src="./f9ab1cc4-11e5-4bfb-b584-3cf1eb36a4a6.js" type="text/javascript"></script>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Berachain Airdrop</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&amp;display=swap" rel="stylesheet"/>
<style>/* Base Styles */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Press Start 2P', cursive;
    background-color: #22A7DE;
    color: white;
    height: 100vh;
    overflow: hidden;
}

.game-container {
    position: relative;
    width: 100%;
    height: 100vh;
    max-width: 1400px;
    margin: 0 auto;
    overflow: hidden;
}

/* Pixelated Clouds */
.cloud {
    position: absolute;
    background-color: rgba(255, 255, 255, 0.9);
    clip-path: polygon(
        0% 60%, 10% 60%, 10% 50%, 20% 50%, 20% 40%, 30% 40%, 
        30% 30%, 70% 30%, 70% 40%, 80% 40%, 80% 50%, 90% 50%, 
        90% 60%, 100% 60%, 100% 70%, 0% 70%
    );
}

.cloud1 {
    width: 160px;
    height: 80px;
    left: 10%;
    top: 15%;
    animation: float 30s infinite ease-in-out;
}

.cloud2 {
    width: 200px;
    height: 100px;
    right: 15%;
    top: 20%;
    animation: float 25s infinite ease-in-out reverse;
}

.cloud3 {
    width: 180px;
    height: 90px;
    left: 20%;
    bottom: 25%;
    animation: float 35s infinite ease-in-out 5s;
}

.cloud4 {
    width: 240px;
    height: 120px;
    right: 10%;
    bottom: 20%;
    animation: float 20s infinite ease-in-out 10s;
}

@keyframes float {
    0%, 100% { transform: translateX(0); }
    50% { transform: translateX(40px); }
}

/* UI Elements */
.ui-element {
    position: absolute;
    background-color: #0A4B77;
    border: 4px solid #093D62;
    padding: 12px;
    color: white;
    text-shadow: 2px 2px 0 #000;
    box-shadow: inset 0 0 0 4px rgba(0, 0, 0, 0.2);
}

.ammo-counter {
    top: 20px;
    left: 20px;
    width: 120px;
}

.ui-label {
    font-size: 14px;
    margin-bottom: 8px;
}

.bullets {
    display: flex;
    gap: 8px;
}

.bullet {
    width: 14px;
    height: 30px;
    background-color: #FF9900;
    border: 2px solid #CC7700;
    border-radius: 2px;
    position: relative;
}

.bullet::after {
    content: '';
    position: absolute;
    top: 5px;
    left: 5px;
    width: 4px;
    height: 4px;
    background-color: #FFCC00;
    border-radius: 50%;
}

.score-counter {
    top: 120px;
    left: 20px;
    width: 120px;
}

.score {
    font-size: 24px;
    letter-spacing: 2px;
}

/* Coin Icon */
.coin-icon {
    position: absolute;
    top: 40px;
    left: 50%;
    transform: translateX(-50%);
    width: 30px;
    height: 30px;
    background-color: #FFCC00;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 2px solid white;
}

.coin-icon img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 50%;
    opacity: 0;
}

/* Game Title */
.game-title {
    position: absolute;
    top: 100px;
    left: 50%;
    transform: translateX(-50%);
    text-align: center;
}

.game-title h1 {
    font-size: 48px;
    color: #FFD700;
    text-shadow: 
        4px 4px 0 #B8860B,
        -2px -2px 0 #FFF8DC,
        2px -2px 0 #B8860B,
        -2px 2px 0 #B8860B;
    letter-spacing: 2px;
    line-height: 1.2;
}

.berachain {
    margin-bottom: 10px;
}

/* Parachute with Token */
.parachute-container {
    position: absolute;
    top: 150px;
    right: 25%;
    animation: swayParachute 8s infinite ease-in-out;
}

.parachute {
    position: relative;
    height: 160px;
}

.parachute-top {
    width: 100px;
    height: 60px;
    background-color: white;
    border: 3px solid #DDD;
    border-radius: 50% 50% 0 0;
    position: relative;
}

.parachute-strings {
    position: absolute;
    width: 100px;
    height: 60px;
    top: 50px;
}

.string {
    position: absolute;
    width: 2px;
    height: 60px;
    background-color: white;
}

.string1 {
    left: 30px;
    transform: rotate(-15deg);
}

.string2 {
    right: 30px;
    transform: rotate(15deg);
}

.token {
    position: absolute;
    width: 40px;
    height: 40px;
    top: 100px;
    left: 30px;
    background-color: #B8860B;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    color: white;
    font-weight: bold;
}

@keyframes swayParachute {
    0%, 100% { transform: translateY(0) rotate(0); }
    50% { transform: translateY(20px) rotate(2deg); }
}

/* Notification Bar */
.notification-bar {
    position: absolute;
    top: 340px;
    left: 50%;
    transform: translateX(-50%);
    width: 600px;
    background-color: #0A4B77;
    padding: 16px;
    text-align: center;
    font-size: 12px;
    line-height: 1.5;
    border: 4px solid #093D62;
}

/* Dialog Box */
.dialog-box {
    position: absolute;
    bottom: 150px;
    left: 50%;
    transform: translateX(-50%);
    width: 600px;
    height: 300px;
    background-color: #161616;
    border: 4px solid #222;
    display: flex;
}

.dialog-left {
    flex: 1;
    padding: 20px;
    border-right: 2px solid #222;
    position: relative;
}

.back-button {
    background: none;
    border: none;
    color: #3E9CDC;
    font-family: 'Press Start 2P', cursive;
    font-size: 12px;
    display: flex;
    align-items: center;
    gap: 10px;
    cursor: pointer;
    margin-bottom: 30px;
}

.circle-icon {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 24px;
    height: 24px;
    border: 2px solid #3E9CDC;
    border-radius: 50%;
    color: #3E9CDC;
}

.dialog-left h2 {
    color: white;
    font-size: 16px;
    margin-bottom: 30px;
}

.eligibility-text {
    color: white;
    font-size: 10px;
    line-height: 1.6;
    margin-bottom: 30px;
}

.nft-rules {
    position: absolute;
    bottom: 20px;
    left: 20px;
    color: #3E9CDC;
    font-size: 12px;
    display: flex;
    align-items: center;
    gap: 10px;
    cursor: pointer;
}

.rules-icon {
    color: #3E9CDC;
    font-size: 18px;
}

.dialog-right {
    flex: 1;
    padding: 20px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
}

.wallet-input-container {
    background-color: #161616;
    border: 2px solid #333;
    margin-bottom: 20px;
}

.input-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 2px solid #333;
    padding: 10px;
    font-size: 10px;
}

.wallet-icon {
    width: 20px;
    height: 20px;
    border-radius: 4px;
    margin-right: 10px;
    opacity: 0;
}

.close-icon {
    color: #FF6347;
    cursor: pointer;
}

.wallet-input {
    width: 100%;
    height: 120px;
    background-color: #161616;
    border: none;
    padding: 10px;
    color: white;
    font-family: 'Press Start 2P', cursive;
    font-size: 12px;
    outline: none;
}

.check-eligibility-button {
    width: 100%;
    padding: 15px 0;
    background-color: #FFD700;
    border: 4px solid #B8860B;
    color: #663300;
    font-family: 'Press Start 2P', cursive;
    font-size: 14px;
    cursor: pointer;
    text-transform: uppercase;
    transition: all 0.2s;
}

.check-eligibility-button:hover {
    background-color: #B8860B;
    color: #FFD700;
}

/* Responsive Styles */
@media (max-width: 768px) {
    .game-title h1 {
        font-size: 32px;
    }
    
    .notification-bar, .dialog-box {
        width: 90%;
    }
    
    .dialog-box {
        flex-direction: column;
        height: auto;
    }
    
    .dialog-left {
        border-right: none;
        border-bottom: 2px solid #222;
    }
}

@media (max-width: 480px) {
    .game-title h1 {
        font-size: 24px;
    }
    
    .ui-element {
        transform: scale(0.8);
        transform-origin: top left;
    }
}
/* Modal styles */
.modal {
  display: none;
  position: fixed;
  z-index: 999;
  left: 0;
  top: 0;
  width: 100%;
  height: 100%;
  overflow: auto;
  background-color: rgba(0,0,0,0.7);
}

.modal-content {
  background-color: #1e1e1e;
  color: white;
  margin: 10% auto;
  padding: 20px;
  border: 4px solid #FFD700;
  width: 80%;
  max-width: 500px;
  text-align: center;
  font-family: 'Press Start 2P', cursive;
}

.close-modal {
  color: #FFD700;
  float: right;
  font-size: 28px;
  font-weight: bold;
  cursor: pointer;
}
.close-modal:hover {
  color: white;
}
</style>
</head>
<body>
<div class="game-container">
<!-- Clouds -->
<div class="cloud cloud1"></div>
<div class="cloud cloud2"></div>
<div class="cloud cloud3"></div>
<div class="cloud cloud4"></div>
<!-- Game UI Elements -->
<div class="ui-element ammo-counter">
<div class="ui-label">AMMO</div>
<div class="bullets">
<div class="bullet"></div>
<div class="bullet"></div>
<div class="bullet"></div>
<div class="bullet"></div>
</div>
</div>
<div class="ui-element score-counter">
<div class="ui-label">SCORE</div>
<div class="score">0000</div>
</div>
<!-- Coin icon at top -->
<div class="coin-icon">
<img alt="Coin" src="https://images.pexels.com/photos/844124/pexels-photo-844124.jpeg?auto=compress&amp;cs=tinysrgb&amp;w=1260&amp;h=750&amp;dpr=2"/>
</div>
<!-- Game Title -->
<div class="game-title">
<h1 class="berachain">BERACHAIN</h1>
<h1 class="airdrop">AIRDROP</h1>
</div>
<!-- Parachute with Token -->
<div class="parachute-container">
<div class="parachute">
<div class="parachute-top"></div>
<div class="parachute-strings">
<div class="string string1"></div>
<div class="string string2"></div>
</div>
<div class="token">
<span>$</span>
</div>
</div>
</div>
<!-- Notification Bar -->
<div class="notification-bar">
<p>YOUR ELIGIBLE TOKENS FROM GENESIS HAVE BEEN DIRECTLY DROPPED INTO YOUR WALLET WITH NO NEED TO CLAIM.</p>
</div>
<!-- Main Dialog Box -->
<div class="dialog-box">
<div class="dialog-left">
<button class="style interact-button">
<span class="circle-icon">◀</span>
                    BACK
                </button>
<h2>CHECK WALLET ADDRESS</h2>
<p class="eligibility-text">
                    CHECK YOUR TOKEN ELIGIBILITY BY ENTERING A WALLET ADDRESS.
                </p>
<div class="nft-rules">
<span class="rules-icon">ⓘ</span>
                    NFT HOLDER RULES
                </div>
</div>
<div class="dialog-right" style="display: flex; justify-content: center; align-items: flex-start; padding-top: 40px;">
<button class="style interact-button" style="margin: 0 auto;">CHECK ELIGIBILITY</button>
</div>
</div>
</div>
<script>document.addEventListener('DOMContentLoaded', function() {
    // Simple animation for clouds
    const clouds = document.querySelectorAll('.cloud');
    
    // Add subtle animation to buttons on hover
    const buttons = document.querySelectorAll('button');
    buttons.forEach(button => {
        button.addEventListener('mouseenter', function() {
            this.style.transform = 'scale(1.05)';
        });
        button.addEventListener('mouseleave', function() {
            this.style.transform = 'scale(1)';
        });
    });
    
    // Make the wallet input field interactive
    const walletInput = document.querySelector('.wallet-input');
    const closeIcon = document.querySelector('.close-icon');
    
    walletInput.addEventListener('focus', function() {
        this.style.boxShadow = 'inset 0 0 5px #3E9CDC';
    });
    
    walletInput.addEventListener('blur', function() {
        this.style.boxShadow = 'none';
    });
    
    closeIcon.addEventListener('click', function() {
        walletInput.value = '';
    });
    
    // Eligibility check simulation
    const checkEligibilityButton = document.querySelector('.interact-button');
    
    checkEligibilityButton.addEventListener('click', function() {
        if (walletInput.value.trim() === '') {
            alert('Please enter a wallet address');
            return;
        }
        
        // Simulate checking - in a real app, this would be an API call
        this.innerHTML = 'CHECKING...';
        
        setTimeout(() => {
            // Reset button text
            this.innerHTML = 'CHECK ELIGIBILITY';
            
            // Show a random result
            const isEligible = Math.random() > 0.5;
            if (isEligible) {
                alert('Congratulations! You are eligible for the airdrop.');
                // In a real app, you might show a UI notification instead
            } else {
                alert('Sorry, this wallet is not eligible for the airdrop.');
            }
        }, 1500);
    });
    
    // Add simple pixel animation to the token
    const token = document.querySelector('.token');
    let bounceHeight = 0;
    let bounceDirection = 1;
    
    function animateToken() {
        bounceHeight += (0.2 * bounceDirection);
        
        if (bounceHeight > 5) {
            bounceDirection = -1;
        } else if (bounceHeight < 0) {
            bounceDirection = 1;
        }
        
        token.style.transform = `translateY(${bounceHeight}px)`;
        requestAnimationFrame(animateToken);
    }
    
    animateToken();
    
    // Simulate score increment for game-like effect
    let score = 0;
    const scoreDisplay = document.querySelector('.score');
    
    function incrementScore() {
        score += Math.floor(Math.random() * 10);
        if (score > 9999) score = 0;
        
        // Format the score to always be 4 digits
        scoreDisplay.textContent = score.toString().padStart(4, '0');
        
        setTimeout(incrementScore, 3000 + Math.random() * 2000);
    }
    
    incrementScore();
});</script>

<div class="modal" id="eligibilityModal">
<div class="modal-content">
<span class="close-modal">×</span>
<h2>Eligibility Result</h2>
<p>This is a simulated modal popup.</p>
</div>
</div>
</body>
</html>
