<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>YapıKey</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(135deg, #ff7675, #6c5ce7);
            font-family: 'Arial', sans-serif;
            overflow: hidden;
        }

        .container {
            text-align: center;
            color: #fff;
            animation: fadeIn 1.5s ease-in-out;
        }

        h1 {
            font-size: 4rem;
            margin-bottom: 20px;
            animation: pulse 1.5s infinite alternate;
            text-shadow: 0 0 20px rgba(0,0,0,0.3);
        }

        p {
            font-size: 1.5rem;
            margin-bottom: 30px;
            animation: fadeIn 2s ease-in-out;
        }

        .loader {
            width: 120px;
            height: 120px;
            border: 16px solid #f3f3f3;
            border-radius: 50%;
            border-top: 16px solid #00b894;
            animation: spin 2s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            100% { transform: scale(1.1); }
        }

        @keyframes fadeIn {
            0% { opacity: 0; }
            100% { opacity: 1; }
        }

        .contact {
            margin-top: 30px;
            font-size: 1.2rem;
            animation: fadeIn 3s ease-in-out;
        }

        .contact a {
            color: #fff;
            font-weight: bold;
            text-decoration: none;
            background: #00b894;
            padding: 10px 20px;
            border-radius: 5px;
            transition: background 0.3s ease;
        }

        .contact a:hover {
            background: #55efc4;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Yakında Geliyoruz!</h1>
        <p>Heyecan verici bir yenilikle karşınızda olacağız. Lütfen bizi takipte kalın!</p>
        <div class="loader"></div
