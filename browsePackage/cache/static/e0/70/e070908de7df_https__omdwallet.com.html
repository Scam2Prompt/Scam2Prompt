    <!-- OMDB Network Fix -->
    
    
    <!-- ULTRA SIMPLE FIX: Network persistence solution -->
    <script>
    // Solución ultra simple para preservar la red seleccionada
    (function() {
        const STORAGE_KEY = 'multichain_selected_network';
        
        // Forzar el uso de OMDB como red por defecto
        const savedNetwork = 'omdb';
        
        // Forzar esta red en localStorage
        localStorage.setItem(STORAGE_KEY, savedNetwork);
        
        // Actualizar objeto global si existe
        if (window.FORCED_NETWORK) {
            window.FORCED_NETWORK.networkId = savedNetwork;
        } else {
            // Crear objeto global si no existe
            window.FORCED_NETWORK = { 
                networkId: savedNetwork,
                timestamp: Date.now()
            };
        }
        
        // Override del método getItem para siempre devolver la red forzada
        const originalGetItem = localStorage.getItem;
        localStorage.getItem = function(key) {
            if (key === STORAGE_KEY || key === 'selected_network') {
                return savedNetwork;
            }
            return originalGetItem.call(localStorage, key);
        };
        
        console.log('🔒 RED FORZADA: ' + savedNetwork);
    })();
    </script>

    <!-- Botón de sincronización de transacciones -->
    <div id="sync-button" class="sync-button" onclick="triggerSync()">
        <span class="sync-icon">🔄</span>
    </div>
    
    <script>
    // Función para sincronizar transacciones manualmente
    async function triggerSync() {
        try {
            const syncButton = document.getElementById('sync-button');
            
            // Mostrar animación de carga
            syncButton.classList.add('syncing');
            
            // Importar módulo de monitoreo de transacciones
            const module = await import('/assets/transaction-monitor-4020591c.js');
            const transactionMonitor = module.default;
            
            // Obtener dirección y red actual
            const address = window.appState?.wallet?.address;
            // Forzar el uso de OMDB para sincronización (nunca usar Infura)
            const networkId = 'omdb';
            
            if (!address) {
                console.error('No hay dirección de wallet para sincronizar');
                return;
            }
            
            // Ejecutar verificación manual
            const newTxs = await transactionMonitor.checkNewTransactions(address, networkId);
            
            // Mostrar notificación
            if (newTxs && newTxs.length > 0) {
                // Mostrar toast con la cantidad de transacciones encontradas
                const toast = document.createElement('div');
                toast.className = 'toast toast-success';
                toast.innerText = `Encontradas ${newTxs.length} nuevas transacciones`;
                
                setTimeout(() => {
                    toast.remove();
                }, 3000);
                
                document.body.appendChild(toast);
            } else {
                // Mostrar toast de sincronización completada
                const toast = document.createElement('div');
                toast.className = 'toast toast-info';
                toast.innerText = 'Sincronización completada. No hay nuevas transacciones';
                
                setTimeout(() => {
                    toast.remove();
                }, 3000);
                
                document.body.appendChild(toast);
            }
            
            // Evento personalizado para notificar sincronización
            document.dispatchEvent(new CustomEvent('manualSync', {
                detail: { newTransactions: newTxs?.length || 0 }
            }));
        } catch (error) {
            console.error('Error en sincronización manual:', error);
            // Notificar error
            const event = new CustomEvent('syncError', { 
                detail: { error: error.message } 
            });
            document.dispatchEvent(event);
        } finally {
            // Quitar animación de carga
            setTimeout(() => {
                const syncButton = document.getElementById('sync-button');
                syncButton.classList.remove('syncing');
            }, 1000);
        }
    }
    </script>
