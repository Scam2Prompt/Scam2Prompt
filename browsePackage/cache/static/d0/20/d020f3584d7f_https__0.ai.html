<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Ultimate AI Domains</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="true">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #f5f5f7;
            color: #1d1d1f;
            line-height: 1.6;
            padding: 2em;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        #container {
            background-color: #ffffff;
            border-radius: 16px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            max-width: 600px;
            padding: 2em;
            text-align: center;
        }

        h1 {
            font-size: 3.5em;
            font-weight: 600;
            color: #000000;
            margin-bottom: 0.5em;
        }

        p {
            font-size: 1.25em;
            color: #666666;
            margin-bottom: 1.5em;
        }

        .note {
            font-size: 1em;
            color: #ff3b30;
            font-weight: 400;
        }

        .banner-image {
            width: 100%;
            max-width: 100%;
            height: auto;
            border-radius: 16px;
            margin-bottom: 1.5em;
        }
    </style>
</head>

<body>
    <div id="container">
        <img src="cover.webp" alt="AI Domains Banner" class="banner-image">
        <h1>The Ultimate AI Domains</h1>
        <p>1.ai 2.ai 3.ai 4.ai 5.ai 6.ai 7.ai 8.ai 9.ai 0.ai</p>
        <p class="note">These domains are currently not for sale</p>
    </div>
</body>

</html>
