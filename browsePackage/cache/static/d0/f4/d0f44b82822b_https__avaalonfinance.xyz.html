  background: transparent;
}

#applied-rules-list::-webkit-scrollbar-thumb {
  background: #353535;
  border-radius: 8px;
}

#applied-rules-list-header {
  font-size: 13px;
  color: #fff;
  font-weight: 500;
}

.applied-rule-list-item {
  border-radius: 8px;
  background: #282828;
  padding: 12px;
  color: #fff;
  font-size: 13px;
  font-weight: 500;
  letter-spacing: 0.25px;
  margin-top: 8px;
  cursor: pointer;
  transition: all 0.2s;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
}

.applied-rule-list-item:hover {
  background: #383838;
}

.applied-rule-list-item:hover .applied-rule-arrow-icon {
  opacity: 1;
}

.applied-rule-list-item:first-child {
  margin-top: 0;
}

.applied-rule-item-details {
  display: flex;
  align-items: center;
  gap: 8px;
}

.applied-rule-icon {
  align-self: center;
}

.applied-rule-icon svg {
  width: 14px;
  height: 14px;
  position: relative;
  top: 2px;
}

.applied-rule-arrow-icon {
  transform: scale(1.2);
  align-self: center;
  transition: 0.2s all;
  opacity: 0;
}

.applied-rule-name {
  max-width: 300px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

#settings-button {
  position: relative;
}

#settings-button[data-tooltip]:hover::after {
  content: attr(data-tooltip);

  position: absolute;
  z-index: 1;
  right: 0px;
  top: 34px;
  width: 158px;
  max-width: 232px;
  padding: 6px 12px;
  color: #fff;
  font-size: 13px;
  font-style: normal;
  font-weight: 400;
  line-height: 150%;
  border-radius: 4px;
  background: #000;
  box-shadow: 0px 8px 16px 0px rgba(0, 0, 0, 0.16);
}

.test-rule-widget-progress-bar {
  height: 6px;
  background: #3c7ff3;
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  width: 100%;
  transition: width 5s linear;
}
</style>
