<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="Калькулятор криптовалют">
    <meta name="keywords" content="криптовалюта, калькулятор, конвертер">
    <title>Крипто Калькулятор</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app">
        <div id="calculator" class="page active">
            <div class="content calculator-content">
                <div class="converter">
                    <div class="input-group">
                        <input type="text" id="amountFrom" placeholder="0.00" inputmode="decimal">
                        <div class="select-wrapper">
                            <div class="select-value" id="cryptoFrom">BTC</div>
                            <div class="select-dropdown" id="cryptoFromDropdown"></div>
                        </div>
                    </div>

                    <button class="switch-btn" id="switchCurrencies">
                        <svg class="switch-icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
                            <path fill="currentColor" d="M5.378 4.513a9.96 9.96 0 0 1 6.627-2.51c5.523 0 10 4.477 10 10a9.95 9.95 0 0 1-1.793 5.715l-2.707-5.715h2.5A8 8 0 0 0 6.279 6.415zm13.253 14.98a9.96 9.96 0 0 1-6.626 2.51c-5.523 0-10-4.477-10-10c0-2.125.663-4.095 1.793-5.715l2.707 5.715h-2.5A8 8 0 0 0 17.73 17.59zm-10.126-5.49h5.5a.5.5 0 1 0 0-1h-4a2.5 2.5 0 1 1 0-5h1v-1h2v1h2.5v2h-5.5a.5.5 0 0 0 0 1h4a2.5 2.5 0 0 1 0 5h-1v1h-2v-1h-2.5z"/>
                        </svg>
                    </button>

                    <div class="input-group">
                        <input type="text" id="amountTo" placeholder="0.00" inputmode="decimal">
                        <div class="select-wrapper">
                            <div class="select-value" id="cryptoTo">USD</div>
                            <div class="select-dropdown" id="cryptoToDropdown"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
        <div id="settings" class="page">
            <div class="content settings-content">
                <div class="settings-container">
                    <button class="settings-button" id="defaultCurrency">
                        <div class="settings-text">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">
                                <path fill="currentColor" d="m16 14l-3 2v-1H8.25l2-2H13v-1zM0 2l3-2v1h4.75l-2 2H3v1zm9.74-2L0 9.74L6.26 16L16 6.26zM1.39 9.74l8.35-8.35l4.87 4.87l-8.35 8.35z"/>
                                <path fill="currentColor" d="m4.17 9.74l-.7.7l2.09 2.09l.7-.7l.74.69l2.74-2.78a2.461 2.461 0 0 1-3.48-3.48L3.48 9z"/>
                                <path fill="currentColor" d="m12.52 5.57l-2.09-2.09l-.7.7l-.73-.7l-2.74 2.78a2.461 2.461 0 0 1 3.48 3.48L12.52 7l-.7-.7z"/>
                            </svg>
                            Основная валюта
                        </div>
                        <span class="settings-value">USD</span>
                    </button>
                    
                    <button class="settings-button" id="priceUpdateInterval">
                        <div class="settings-text">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 36 36">
                                <path fill="currentColor" d="M18 2a16 16 0 1 0 16 16A16 16 0 0 0 18 2m0 30a14 14 0 1 1 14-14a14 14 0 0 1-14 14"/>
                                <path fill="currentColor" d="M18.92 18.4v-7.65a1 1 0 0 0-2 0v8.72l5.9 4a1 1 0 1 0 1.11-1.66Z"/>
                                <path fill="currentColor" d="M8 17.94a9.94 9.94 0 0 1 15.41-8.35l.85-1.36a11.55 11.55 0 1 0-8.53 21L16 27.7a10 10 0 0 1-8-9.76"/>
                                <path fill="none" d="M0 0h36v36H0z"/>
                            </svg>
                            Интервал обновления цен
                        </div>
                        <span class="settings-value">30 сек</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div class="bottom-menu">
        <button class="nav-btn active" data-page="calculator">
            <svg class="icon" xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 14 14">
                <path fill="currentColor" fill-rule="evenodd" d="M6.375 0H2.5A2.5 2.5 0 0 0 0 2.5v3.875h6.375zM0 11.5V7.625h6.375V14H2.5A2.5 2.5 0 0 1 0 11.5M7.625 14V7.625H14V11.5a2.5 2.5 0 0 1-2.5 2.5zM14 2.5v3.875H7.625V0H11.5A2.5 2.5 0 0 1 14 2.5m-11.967.225a.625.625 0 0 0 0 1.25h.625V4.6a.625.625 0 1 0 1.25 0v-.625h.625a.625.625 0 0 0 0-1.25h-.625V2.1a.625.625 0 0 0-1.25 0v.625zm6.992.625c0-.346.28-.625.625-.625h2a.625.625 0 0 1 0 1.25h-2a.625.625 0 0 1-.625-.625m.625 5.682a.625.625 0 1 0 0 1.25h2a.625.625 0 1 0 0-1.25zm-.625 2.625c0-.345.28-.625.625-.625h2a.625.625 0 1 1 0 1.25h-2a.625.625 0 0 1-.625-.625M1.781 9.215a.625.625 0 0 1 .884 0l.618.618l.618-.618a.625.625 0 1 1 .884.884l-.618.618l.618.618a.625.625 0 0 1-.884.884l-.618-.618l-.618.618a.625.625 0 0 1-.884-.884l.618-.618l-.618-.618a.625.625 0 0 1 0-.884" clip-rule="evenodd"/>
            </svg>
            <span class="label">Калькулятор</span>
        </button>
        <button class="nav-btn" data-page="settings">
            <svg class="icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
                <mask id="lineMdCogFilledLoop0">
                    <defs>
                        <symbol id="lineMdCogFilledLoop1">
                            <path d="M11 13L15.74 5.5C16.03 5.67 16.31 5.85 16.57 6.05C16.57 6.05 16.57 6.05 16.57 6.05C16.64 6.1 16.71 6.16 16.77 6.22C18.14 7.34 19.09 8.94 19.4 10.75C19.41 10.84 19.42 10.92 19.43 11C19.43 11 19.43 11 19.43 11C19.48 11.33 19.5 11.66 19.5 12z">
                                <animate fill="freeze" attributeName="d" begin="0.5s" dur="0.2s" values="M11 13L15.74 5.5C16.03 5.67 16.31 5.85 16.57 6.05C16.57 6.05 19.09 5.04 19.09 5.04C19.25 4.98 19.52 5.01 19.6 5.17C19.6 5.17 21.67 8.75 21.67 8.75C21.77 8.92 21.73 9.2 21.6 9.32C21.6 9.32 19.43 11 19.43 11C19.48 11.33 19.5 11.66 19.5 12z"/>
                            </path>
                        </symbol>
                    </defs>
                    <g fill="none" stroke="#fff" stroke-width="2">
                        <path stroke-dasharray="36" stroke-dashoffset="36" stroke-width="5" d="M12 7c2.76 0 5 2.24 5 5c0 2.76 -2.24 5 -5 5c-2.76 0 -5 -2.24 -5 -5c0 -2.76 2.24 -5 5 -5Z">
                            <animate fill="freeze" attributeName="stroke-dashoffset" dur="0.5s" values="36;0"/>
                            <set fill="freeze" attributeName="opacity" begin="0.5s" to="0"/>
                        </path>
                        <g fill="#fff" stroke="none" opacity="0">
                            <use href="#lineMdCogFilledLoop1"/>
                            <use href="#lineMdCogFilledLoop1" transform="rotate(60 12 12)"/>
                            <use href="#lineMdCogFilledLoop1" transform="rotate(120 12 12)"/>
                            <use href="#lineMdCogFilledLoop1" transform="rotate(180 12 12)"/>
                            <use href="#lineMdCogFilledLoop1" transform="rotate(240 12 12)"/>
                            <use href="#lineMdCogFilledLoop1" transform="rotate(300 12 12)"/>
                            <set fill="freeze" attributeName="opacity" begin="0.5s" to="1"/>
                            <animateTransform fill="freeze" attributeName="transform" dur="30s" type="rotate" values="0 12 12;360 12 12"/>
                        </g>
                    </g>
                    <circle cx="12" cy="12" r="3.5"/>
                </mask>
                <rect width="24" height="24" fill="currentColor" mask="url(#lineMdCogFilledLoop0)"/>
            </svg>
            <span class="label">Настройки</span>
        </button>
    </div>

    <div class="modal-overlay"></div>
    <div class="crypto-modal">
        <div class="modal-header">
            <input type="text" class="modal-search" placeholder="Поиск криптовалюты...">
        </div>
        <div class="crypto-list">
            
        </div>
    </div>

    <div class="loading-screen">
        <svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 14 14">
            <defs>
                <style type="text/css">
                    .st0{fill-rule:evenodd;clip-rule:evenodd;fill:#bdbdbd !important;}
                    #Слой_5 {animation: pressButton 1s ease-in-out infinite; animation-delay: 0.96s;}
                    #Слой_4 {animation: pressButton 1s ease-in-out infinite; animation-delay: 0.24s;}
                    #Слой_2 {animation: pressButton 1s ease-in-out infinite; animation-delay: 1.68s;}
                    #Слой_3 {animation: pressButton 1s ease-in-out infinite; animation-delay: 0.6s;}
                </style>
            </defs>
            <g id="Слой_5" class="button-press" style="animation-delay: 0s">
                <path class="st0" d="M0,7.6v3.9C0,12.9,1.1,14,2.5,14h3.9V7.6H0z M3.8,11v1.9h-1V11c-1.1,0-1.9-0.3-1.9-0.5c0-0.3,0.8-0.5,1.9-0.5V9.4H1.5V8.5h3.6v0.9H3.8V10c1.1,0,1.9,0.3,1.9,0.5C5.7,10.8,4.8,11,3.8,11z"/>
                <path class="st0" d="M5.4,10.5c0,0.2-0.7,0.4-1.7,0.4c0,0-0.2,0-0.5,0c-0.3,0-0.4,0-0.5,0c-1,0-1.7-0.2-1.7-0.4c0-0.2,0.7-0.4,1.7-0.4v0.6c0.1,0,0.2,0,0.5,0c0.3,0,0.5,0,0.5,0v-0.6C4.7,10.1,5.4,10.3,5.4,10.5z"/>
            </g>
            <g id="Слой_4" class="button-press" style="animation-delay: 0.1s">
                <path class="st0" d="M2.5,0C1.1,0,0,1.1,0,2.5v3.9h6.4V0H2.5z M3.9,5v0.8H3.4V5H3v0.8l-0.5,0l0-0.8H1.6l0.1-0.6c0,0,0.3,0,0.3,0c0.1,0,0.2-0.1,0.2-0.2l0-1.2V2.1C2.2,2,2.1,1.9,2,1.9c0,0-0.3,0-0.3,0V1.4h0.9V0.7H3v0.8c0.1,0,0.3,0,0.4,0V0.7l0.5,0v0.8c0.6,0,1.1,0.2,1.1,0.8C5,2.6,4.9,2.9,4.6,3C5,3.1,5.3,3.4,5.3,4C5.2,4.7,4.7,4.9,3.9,5z"/>
                <path class="st0" d="M4.3,3.9c0,0.6-1,0.5-1.3,0.5v-1C3.3,3.4,4.3,3.3,4.3,3.9z"/>
                <path class="st0" d="M4.1,2.4C4.1,3,3.3,2.9,3,2.9V2C3.3,2,4.1,1.9,4.1,2.4z"/>
            </g>
            <g id="Слой_2" class="button-press" style="animation-delay: 0.2s">
                <path class="st0" d="M11.5,0H7.6v6.4H14V2.5C14,1.1,12.9,0,11.5,0z M10.6,5.7L9,3.5l1.6,0.9V5.7z M10.6,4.3L9,3.4l1.6-0.7V4.3z M10.6,2.5L9,3.2l1.6-2.6V2.5z M10.7,5.7V4.5l1.6-0.9L10.7,5.7z M10.7,4.3V2.7l1.6,0.7L10.7,4.3z M10.7,2.5V0.7l1.6,2.6L10.7,2.5z"/>
            </g>
            <g id="Слой_3" class="button-press" style="animation-delay: 0.3s">
                <path class="st0" d="M7.6,7.6V14h3.9c1.4,0,2.5-1.1,2.5-2.5V7.6H7.6z M9.4,10.7l-0.2,0.6H8.8l-0.4-1h0.4L9,10.9l0.2-0.6h0.4l0.2,0.6l0.2-0.6h0.4l-0.4,1H9.6L9.4,10.7z M12.9,11.3L12.5,11l-0.4,0.3h-0.4l-0.2-0.2h-0.7l0.2-0.2h0.3l-0.3-0.3l-0.9,1H9.8l1.1-1.3h0.4l0.6,0.7l0.3-0.2L11.3,10h0.4l1.5,1.3H12.9z M12.8,10.7l-0.3-0.2l0.2-0.2h0.5L12.8,10.7z"/>
            </g>
        </svg>
    </div>

    <div class="currency-modal" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Выберите основную валюту</h3>
                <button class="close-modal">&times;</button>
            </div>
            <div class="currency-list">
                
            </div>
        </div>
    </div>

    <div class="interval-modal" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Интервал обновления цен</h3>
                <button class="close-interval-modal">&times;</button>
            </div>
            <div class="interval-settings">
                <div class="interval-slider">
                    <input type="range" id="intervalRange" min="1" max="5" value="2">
                    <div class="interval-values">
                        <span>10с</span>
                        <span>30с</span>
                        <span>1м</span>
                        <span>2м</span>
                        <span>5м</span>
                    </div>
                    <div class="selected-value">30 сек</div>
                </div>
                <button id="applyInterval" class="apply-button">Применить</button>
            </div>
        </div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready();
    </script>
    <script src="script.js" defer></script>
</body>
</html>
