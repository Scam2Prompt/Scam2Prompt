    <!DOCTYPE html>
    <html>
    <head>
        <title>Login</title>
        <style>
            body {
                font-family: Arial, sans-serif;
                background-color: white;
                color: blue;
                text-align: center;
                padding-top: 100px;
            }
            input[type="password"] {
                padding: 10px;
                font-size: 16px;
            }
            button {
                padding: 10px 20px;
                font-size: 16px;
                cursor: pointer;
            }
        </style>
    </head>
    <body>
        <h2>Enter Password</h2>
        <form method="POST">
            <input type="password" name="password" required>
            <button type="submit">Login</button>
        </form>
            </body>
    </html>
