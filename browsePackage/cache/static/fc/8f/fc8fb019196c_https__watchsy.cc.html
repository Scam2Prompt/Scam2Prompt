<script>
  function showCustomAlert(message) {
    // Remove existing alert if present to avoid stacking
    const existing = document.getElementById('customAlert');
    if (existing) {
      existing.remove();
    }

    const alertContainer = document.createElement('div');
    alertContainer.innerHTML = `
      <div id="customAlert" style="
        position: fixed;
        top: -100px;
        left: 50%;
        transform: translateX(-50%);
        width: 90%;
        max-width: 400px;
        z-index: 9999;
        background: #ffffff;
        color: #111;
        padding: 15px 20px;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
        font-size: 15px;
        border-radius: 12px;
        box-shadow: 0 6px 16px rgba(0,0,0,0.15);
        display: flex;
        align-items: center;
        gap: 10px;
        transition: top 0.5s ease;
      ">
        <img src="https://cdn-icons-png.flaticon.com/512/1827/1827349.png" alt="notification" style="width: 20px; height: 20px;">
        <span style="flex: 1;">${message}</span>
      </div>
    `;
    document.body.appendChild(alertContainer);

    // Slide down animation
    setTimeout(() => {
      document.getElementById('customAlert').style.top = '20px';
    }, 50);

    // Slide up and remove after 5 seconds
    setTimeout(() => {
      const box = document.getElementById('customAlert');
      if (box) {
        box.style.top = '-100px';
        setTimeout(() => box.remove(), 500);
      }
    }, 5000);
  }
</script>
