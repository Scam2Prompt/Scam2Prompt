in-h-screen h-full"><div id="__next"><div data-sentry-component="ErrorBoundary" data-sentry-source-file="ErrorBoundary.tsx"><link href="https://fonts.googleapis.com/css2?family=EB Garamond&amp;display=swap" rel="stylesheet" data-sentry-component="FontLoader" data-sentry-source-file="Theme.tsx"/></div></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__typename":"AppConfig","slug":"metlife","name":"MetLife","isDemo":false,"theme":{"--font-tenant":"EB Garamond","--font-tenant-leading":"1.3","--font-tenant-tracking":"0","--primary":"0,144,218","--planner-1-light":"#CCE8EF","--planner-1-medium":"#B2DDE8","--planner-1-dark":"#008EB1","--planner-2-light":"#D4EEE1","--planner-2-medium":"#BFE5D3","--planner-2-dark":"#29AA6B","--document-fallback":"#D6E5EE","--document-will":"#D6E5EE","--document-ahd":"#E7E8D9","--document-poa":"#EAE2C1","--document-trust":"#E2DEE8","--document-funeral":"#E6DFDD","--document-wishes":"#D9E3DF"},"content":{"__typename":"AppContent","disclaimer":null,"privacyPolicy":"_Last Updated: March 2024_\\n\\nLifeVault is a program available to policyholders of MetLife Insurance Company (“**MetLife**”), which is powered by The Empathy Project Inc. along with its affiliates (“**Empathy**”, “**we**,” “**our**” or “**us**”). Empathy respects the privacy of users of the LifeVault website (the **“Site”**), the services provided through LifeVault, and any other or subsequent product, process, development, tangible embodiment, or service provided through LifeVault (collectively, “**LifeVault**” or the “**Platform**”).\\n\\nWe are committed to protecting the Personal Data (defined below) that is made available to us.\\n\\nThis Privacy Policy describes how Empathy, collects, stores, uses and discloses the following categories of Personal Data as a “Business” to the extent applicable under data protection laws:\\n\\n1. **User Data**: Personal Data relating to individuals who have engaged with the Platform to support them as they plan and prepare for end-of-life (collectively, “**Users**”) and any online ads and content, emails or communications under our control (collectively with the Platform, the “**Services**”).\\n2. **Designated Person Data (as provided by Users)**: Personal Data relating to individuals that a User has designated as heirs, beneficiaries, and/or appointees (e.g., spouse, partner, children, or other relatives or relevant individuals), (as applicable, the “**Designated Person**”).\\n\\nSpecifically, this Policy describes our practices regarding:\\n\\n1. [Data Collection](#_heading=h.gjdgxs) \u0026 Processing\\n2. [Data Uses](#_heading=h.30j0zll)\\n3. [Data Location](#_heading=h.2et92p0)\\n4. [Data Retention](#_heading=h.tyjcwt)\\n5. [Data Disclosure](#_heading=h.3dy6vkm)\\n6. [Cookies and Data Collection Technologies](#_heading=h.1t3h5sf)\\n7. [Communications](#_heading=h.4d34og8)\\n8. [Data Security](#_heading=h.2s8eyo1)\\n9. [Data Subject Rights](#_heading=h.17dp8vu)\\n10. [Opt-Out of Sale/Sharing](#_heading=h.3rdcrjn)/Targeted Advertising\\n11. [Additional Notices and Contact Details](#_heading=h.26in1rg)\\n\\n**If you are a User or Designated Person, please read this Privacy Policy carefully and make sure that you fully understand it.**\\n\\nYou are not legally required to provide us with any Personal Data. If you do not wish to provide us with your Personal Data, or to have it processed by us or any of our Service Providers (as defined below), please do not provide it to us, avoid interaction with us and our Site, and do not use our Services.\\n\\n## **Data Collection \u0026 Processing**\\n\\nWhen we use the terms “**Personal Data**” or “**Personal Information**” in this Privacy Policy, we mean information that identifies, relates to, describes, is reasonably capable of being associated with, or could reasonably be linked, directly or indirectly, to an individual. It does not include aggregated or deidentified information that is maintained in a form that is not reasonably capable of being associated with or linked to an individual.\\n\\n**Types of Personal Data collected.** We may collect or generate the following types of Personal Data about individuals through the Services:\\n\\n- **Usage, login credentials, and device information concerning Users**\\n\\nConnectivity, technical and aggregated usage data, such as user agent, IP addresses and approximate location based upon such IP addresses, digital identifiers, device data (like type, OS, device id, browser version, locale and language settings used), activity logs, session recordings, log-in credentials to the Services, the Cookies and pixels installed or utilized on their device (which collect data such as how often Users visit or use the Site, which pages they visit and when, and which website ad or email message brought them there), and inferred or presumed data on or generated from their use of the Services.\\n\\n- **Information concerning our Users**\\n\\nContact details such as name, email address, phone number, position, workplace as well as any expressed, presumed or identified needs, preferences, attributes and insights relevant to our potential or existing engagement.\\n\\n- **Information concerning Users of the Platform**\\n\\nContact details such as name, email address, and phone number; address or geolocation; state of residence; date of birth; drivers’ license number(s) or national ID number (including social security number, as relevant); at the choice of the User, information, including certain sensitive information, required to access particular Services such as generation of a Will, Power of Attorney or Advance Directive (e.g., financial assets making up an estate or medical records and information); documentation uploaded through use of the secure vault where you can upload and store important documents to be accessed by your Designated Persons (the “**Vault**”), including, but not limited to, personal photos, content of personal communications, and legal, financial, and health documents, which may include, at the User’s discretion, certain sensitive information; additional background including gender, age, religion, marital status, military or veteran status, national origin, professional experience, as well as any expressed, presumed, or identified needs, preferences, attributes, and insights relevant to Users.\\n\\n- **Information concerning Designated Persons as provided to Empathy by Users**\\n\\nAt the User’s choice, information required to access particular Services such as generation of a Will or Power of Attorney, including, but not limited to: contact details such as name, email address, and phone number; address or state of residence; relation to the User; national ID number (including social security number, as relevant), relevant financial assets to facilitate bequeathment, as well as any expressed, presumed, or identified needs, preferences, attributes, and insights relevant to Designated Persons, as provided by the User.\\n\\nFor the purposes of the California Consumer Privacy Act (\\\"**CCPA**\\\"), in the last 12 months, we have collected the following categories of Personal Information, as defined in the CCPA: identifiers; geolocation data; customer records information; characteristics of protected classifications; commercial information; internet or other electronic network activity information; audio, electronic, visual, or similar information; professional or employment related information; inferences; and Sensitive Personal Information (as defined in the CCPA and as described above).\\n\\n**Categories of sources from which Personal Data is collected.** We obtain Personal Data from the following categories of sources:\\n\\n- **Data collected directly from Users**. You may voluntarily provide us with your Personal Data, e.g., when you use LifeVault or submit a form on our website; or use our customer or support services; during an event, conference, or webinar you have participated in; register to our mailing list, or communicate with us in any other manner during our engagement with you. You may also provide us with your Personal Data when you upload, post, generate or publish on our Site or through the Platform or use the Vault. All Designated Persons’ Data processed by Empathy is provided by Users in the context of providing the Services.\\n- **Data collected from third parties**. We obtain Personal Data from third parties, such as our Service Providers e.g., marketing and sales tools, data enrichment services, our sales and marketing partners, or distributors.\\n- **Data collected from publicly available sources.** We may obtain Personal Data from publicly available sources in order to provide you with our Services.\\n- **Data that is automatically generated.** Some Personal Data is automatically generated when you visit our website and engage its features (such as your online activity, clicks, web-pages visits, etc.) by using Cookies and the data collection technologies described in Section 6 below. We may also collect aggregated or technical data generated when you use our Services, relating to how you use them, so we can learn how Users use our Services and improve them and our Users’ experience.\\n\\n## **Data Uses**\\n\\nWe use Personal Data for the following business and commercial purposes:\\n\\n**User and Designated Person Personal Data**\\n\\n- To facilitate, operate, enhance, and provide our Services, and process new product and service orders;\\n- To provide assistance and support, to test and monitor the Services, or diagnose or fix technology problems;\\n- To personalize our Services, including by recognizing an individual and remembering their information when they return to our Services, and to provide further localization and personalization capabilities.\\n\\n**User Personal Data**\\n\\n- To gain a better understanding of how individuals use and interact with our Services (including through online and personal surveys), which content and data they have processed through our Services, and how we may improve their and others’ user experience and the value they can generate from using the Services, so we can continue improving our products, offerings and the overall performance of our Services;\\n- To contact our Users and Designated Persons with general or personalized service-related messages, as well as promotional messages that may be of specific interest to them;\\n- To support and enhance our data security measures, including for the purposes of preventing and mitigating the risks of fraud, error or any illegal, criminal or prohibited activity;\\n\\n**User and Designated Person Personal Data**\\n\\n- To create aggregated statistical data, inferred non-personal data, or anonymized or pseudonymized data (rendered non-personal and non-identifiable), which we or our business partners may use to provide and improve our respective services, or for any other purpose;\\n- To enforce our commercial agreements, to resolve disputes, to carry out our obligations and enforce our rights, and to protect our business interests and the interests and rights of third parties;\\n- To comply with our contractual and legal obligations and requirements, and maintain our compliance with applicable laws, regulations and standards.\\n\\nIf you reside or are using the Services in a territory governed by privacy laws under which “consent” is the only or most appropriate legal basis for the processing of Personal Data as described herein (in general, or specifically with respect to the types of Personal Data you expect or elect to be processed by or via the Services, or due to nature of such processing), your acceptance of our Terms of Service and this Privacy Policy (collectively, the “**Terms**”) will be deemed as your consent to the processing of your Personal Data for all purposes detailed herein. If you wish to revoke such consent, please contact us at [privacy@empathy.com](mailto:privacy@empathy.com).\\n\\n## **Data Location and Transfers**\\n\\nWe and our authorized Service Providers maintain, store and process Personal Data in the United States and Israel as reasonably necessary for the proper delivery and performance of our Services, or as may be required by law.\\n\\nSince we operate globally and may use service providers worldwide, including in the United States, Israel and other locations as reasonably necessary for the proper performance of our Services, or as may be required by law, we may transfer your Personal Data outside your country of residence.\\n\\nWhile privacy laws may vary between jurisdictions, Empathy is committed to protecting Personal Data in accordance with this Privacy Policy and customary industry standards, and such appropriate lawful mechanisms and contractual terms requiring adequate data protection, regardless of any lesser legal requirements that may apply in the jurisdiction to which such Personal Data is transferred.\\n\\n## **Data Retention**\\n\\nWe retain Personal Data for as long as we deem it as reasonably necessary to maintain and expand our relationship and provide you with our Services and offerings; to comply with our contractual obligations; or to protect ourselves from any potential disputes (i.e., as required by laws applicable to log-keeping, records and bookkeeping, and in order to have proof and evidence concerning our relationship, should any legal issues arise following your discontinuance of use), all in accordance with our data retention policy.\\n\\nTo determine the appropriate period for Personal Data, we consider the amount, nature, and sensitivity of the Personal Data, the potential risk of harm from unauthorized use or disclosure of your Personal Data, the purposes for which we process your Personal Data and the applicable legal requirements.\\n\\nIf you have any questions regarding our data retention practices, please contact us by email at [privacy@empathy.com](mailto:privacy@empathy.com).\\n\\n## **Data Disclosure**\\n\\nWe disclose Personal Data in the following ways:\\n\\n- **Service Providers**: We engage selected third-party companies and individuals to perform services on our behalf or complementary to our own. Such service providers may include commercial software providers, hosting and server co-location services, communications and content delivery networks (CDNs), data security services, fraud detection and prevention services, web and product analytics, e-mail distribution and monitoring services, session or activity recording services, remote access services, content transcription and analysis services, performance measurement, data optimization and marketing services, social and advertising networks, content and data enrichment providers, e-mail, voicemails, support, enablement and customer relation management systems, and our legal, financial and compliance advisors. Service Providers may have access to Personal Data, depending on each of their specific roles and purposes in facilitating and enhancing our Services, and may only use the data as determined in our agreements with them.\\n- **Designated Persons**: We may disclose User Personal Data to Designated Persons as determined and controlled by the User in their sole discretion.\\n- **Referring Party**: Empathy may disclose Personal Data to the party that referred you to LifeVault (e.g., financial advisors), for the purposes described in this Privacy Policy.\\n- **Legal Compliance**: We may disclose or allow government and law enforcement officials access to your Personal Data in response to a legal request, such as a subpoena, search warrant or court order (or similar requirement), or in compliance with applicable laws and regulations, with or without notice to you. Such disclosure or access may occur if we believe in good faith that: (a) we are legally compelled to do so; (b) disclosure is appropriate in connection with efforts to investigate, prevent, or take action regarding actual or suspected illegal activity, fraud, or other wrongdoing; or (c) such disclosure is required to protect our legitimate business interest, including the security or integrity of our products and Services.\\n- **Protecting Rights and Safety**: We may share your Personal Data with others, if we believe in good faith that this will help protect the rights, property or personal safety of Empathy, any of our Users, Designated Persons, or any members of the general public.\\n- **MetLife Family of Companies**: We may share Personal Data with MetLife and their affiliated companies, for the purposes described in this Privacy Policy.\\n- **Empathy Affiliated Companies:** We may share Personal Data internally with our affiliated companies, for the purposes described in this Privacy Policy. In addition, should Empathy or any of its affiliates undergo any change in control, including by means of merger, acquisition or purchase of substantially all of its assets, your Personal Data may be shared with the parties involved in such event.\\n- **Additional Sharing**: Empathy may share your Personal Data in additional manners, pursuant to your explicit approval, or if we are legally obligated to do so, or if we have successfully rendered such data non-personal and anonymous. Additionally, we may transfer, share or otherwise use non-Personal Data at our sole discretion and without the need for further approval.\\n\\nFor the purposes of the CCPA, in the past 12 months, we may have disclosed: identifiers; geolocation data; customer records information; characteristics of protected classifications; commercial information; Internet or other electronic network activity information; audio, electronic, visual, or similar information; professional or employment related information; inferences; and Sensitive Personal Information to Service Providers, Designated Persons, Referring Parties, the MetLife Family of Companies, to Empathy Affiliated Companies or for Legal Compliance or to Protect Rights and Safety. We did so in pursuit of the business and commercial purposes described in Section 2 above. We do not use or disclose sensitive Personal Information outside of purposes permitted under the CCPA.\\n\\n## **Cookies and Data Collection Technologies**\\n\\nWe and our Service Providers use Cookies and other similar technologies to enable and improve the Services we provide, to track the performance of our Site, perform analytics and gain insights on the use of our Services and the performance of our activities, and for personalization purposes including personalization of ads if we have obtained your consent. For more information on our cookie and data collection technologies practices, please see our Cookie Policy in Section 12 below.\\n\\nCookies are packets of information sent to your web browser and then sent back by the browser each time it accesses the server that sent the cookie. Some Cookies are removed when you close your browser session. These are the “Session Cookies”. Some last for longer periods and are called “Persistent Cookies”. We use both types.\\n\\nSome Cookies are necessary for the Services to function properly, and cannot be declined or disabled unless you delete and block them through your web browser settings. Other Cookies, which are used for functional, performance, analytics and marketing purposes, are optional. You may opt-in to or opt-out from the use of optional Cookies through the “Your Privacy Choices” feature available on our website, depending on your location and activity on our Services, as applicable. If you choose to opt-out of certain Cookies, this will typically generate a new cookie which will preserve your choice, and indicate it to our Services in your next visits so that the Cookies you opted-out of will not be utilized. You can also manage your Cookies preferences, and accept, remove or entirely block Cookies, through your browser settings.\\n\\nPlease note that certain web browsers may transmit “Do Not Track” signals to websites with which the browser communicates, telling the website not to follow its online movements. Because of differences in how web browsers interpret this feature and send those signals, and lack of standardization, we currently do not respond to such “Do Not Track” signals.\\n\\nWe also use the web analytics tool Google Analytics. This tool helps us understand users’ behavior on our Services, including by tracking page content, and click/touch, movements, scrolls and keystroke activities. Further information about the privacy practices of our analytics service provider is available at: [www.google.com/policies/privacy/partners](http://www.google.com/policies/privacy/partners). Further information about your option to opt-out of this analytics service is available at: \u003chttps://tools.google.com/dlpage/gaoptout\u003e.\\n\\nPlease note that if you get a new device, install a new browser, erase or otherwise alter your browser’s cookie file (including upgrading certain browsers), you may also clear the opt-out Cookies installed once you opt-out, so an additional opt-out will be necessary to prevent additional tracking.\\n\\n## **Communications**\\n\\n**Service Communications**: Empathy may contact you with important information regarding our Services. For example, we may notify you (through any of the means available to us) of changes or updates to our Services, service maintenance or changes, or password retrieval notices. You will not be able to opt out of receiving such service communications while using our Services, as they are integral to such use.\\n\\n**Notifications and Promotional Communications**: We may send you notifications concerning new features, offerings, events, and special opportunities or any other information we think you will find valuable. We may provide such notices through any of the contact means available to us (e.g., phone, mobile or email), through the Services, or through our marketing campaigns on any other websites or platforms.\\n\\nIf you do not wish to receive such promotional communications, you may notify us at any time by sending an email to [privacy@empathy.com](mailto:privacy@empathy.com) or by following the \\\"unsubscribe\\\", \\\"stop\\\" or \\\"change email preferences\\\" instructions contained in the promotional communications you receive.\\n\\n## **Data Security**\\n\\nEmpathy and its Service Providers implement systems, applications, and procedures to secure your Personal Data, to minimize the risks of theft, damage, loss of information, or unauthorized access or use of information. These measures provide sound industry-standard security. However, please be aware that regardless of any security measures used or implemented, we cannot and do not guarantee the absolute protection and security of any Personal Data stored with us or with any third parties.\\n\\n## **Data Subject Rights**\\n\\nIndividuals have rights concerning their Personal Data. Please contact us by e-mail at: [privacy@empathy.com](mailto:privacy@empathy.com) if you wish to exercise your privacy rights under any applicable law, including US state privacy laws, such as the CCPA, as amended from time to time. Such rights may include, to the extent applicable, the right to know/request access to specific pieces of Personal Data collected; categories of Personal Data collected; categories of sources from whom the Personal Data was collected; purpose of collecting Personal Data; categories of third parties with whom we have shared Personal Data, to request rectification or erasure of your Personal Data held with Empathy, or to restrict or object to such Personal Data’s processing (including the right to direct us not to sell or share your Personal Data to third parties now or in the future, or the right to opt-out of processing Personal Data for the purposes of targeted advertising, as described below), or the right to equal services and prices (e.g., freedom from discrimination) (each to the extent available to you under the laws which apply to you).\\n\\nTo the extent applicable to you, you may also designate an authorized agent, in writing or through a power of attorney, to request to exercise your privacy rights on your behalf. The authorized agent may submit a request to exercise these rights by emailing us.\\n\\nWhen you or an authorized agent ask us to exercise any of your rights, we may need to ask you to provide us certain credentials to make sure that you are who you claim you are, to avoid disclosure to you of Personal Data related to others and to ask you to provide further information to better understand the nature and scope of data that you request to access. We may not be able to fulfil your request unless you have provided sufficient information that enables us to reasonably verify that you are the individual about whom we collected the Personal Data. We may then request additional information for legal purposes (e.g., as proof of the identity of the person submitting the request, or proof of request fulfillment).\\n\\nWe may redact from the data which we will make available to you, any Personal Data or confidential information related to others.\\n\\nIf you are a resident of Virginia, Colorado or Connecticut, you may also have the right to appeal if we decline to take action regarding your request. We will notify you providing our reasons and instructions for how you can appeal the decision. If you are a Colorado resident, you may also have the right to contact the Colorado Attorney General if you have concerns about the result of the appeal.\\n\\n## **Opt-Out of Sale/Sharing/Targeted Advertising**\\n\\nUnder some US data protection laws such as the CCPA, our disclosure of certain internet activity and device information to third parties through Cookies may be considered a “sale” or “sharing” of Personal Information or processing for purposes of “targeted advertising” as such terms are defined under US data protection laws. We do so in pursuit of the business and commercial purposes described in Section 2 above.\\n\\nTo opt out of all Cookies that may result in a “sale” and/or “sharing” of your Personal Information or processing for purposes of targeted advertising, and for additional information on our Cookie Policy, please see our Cookie Policy below, in Section 12.\\n\\n## **Additional Notices and Contact Details**\\n\\n**Updates and Amendments**: We may update and amend this Privacy Policy from time to time by posting an amended version on our Services. We will make reasonable efforts to post a notice on our Services and/or send you an email (to the extent that you provided us with your email address) regarding the change if we believe any substantial changes are involved. Such changes will take effect seven (7) days after the notice is posted on the Services or sent via email, whichever is earlier. After such notice period, all amendments to this Privacy Policy shall be deemed accepted by you.\\n\\n**External Links**: While our Services may contain links or integrations to other websites, social networks or services, we are not responsible for their privacy practices, and encourage you to pay attention when you leave our Services for the website or services of such third parties, or interact with social network integrations. We recommend you read the privacy policies of each and every website and service you visit. This Privacy Policy only applies to our Services.\\n\\n**Children’s Privacy**: Our Services are not intended for use by children under the age of 18. We do not knowingly collect Personal Data from minors under the age of 18 and do not wish to do so. If we learn we have collected or received Personal Information from a child under 18 without verification of parental consent, we will delete that information. If you believe we might have any information from or about a child under 18, please contact us at [privacy@empathy.com](mailto:privacy@empathy.com).\\n\\n**Contacting Us**: If you have any comments or questions about this Privacy Policy or if you have any concerns regarding your Personal Data held with us, please contact us at [privacy@empathy.com](mailto:privacy@empathy.com).\\n\\n## **Cookie Policy**\\n\\nWe use certain web monitoring and tracking technologies, such as cookies, beacons, pixels, tags, and scripts (collectively, “**Cookies**”). These technologies are used in order to provide, maintain, and improve our Services, to optimize our offerings and marketing activities, and to provide you with a better experience (for example, in order to track your preferences, to better secure our Services, to identify technical issues, and to monitor and improve the overall performance of our Services).\\n\\nThis Cookie Policy contains information on our cookie practices. If you are unable to find the information you were looking for, or you have any further questions about the use of Cookies on our Services, please email [privacy@empathy.com](mailto:privacy@empathy.com).\\n\\n## **What are Cookies?**\\n\\nCookies are small files containing a string of characters that are stored on your computer or mobile device through the browser (for example, Google Chrome or Safari). You can think of Cookies as providing a so-called memory for the website, so that it can recognize you when you come back and respond appropriately.\\n\\nSuch Cookies can collect information and data such as your IP address, nationality, city, type of device, browser, operating system, screen resolution, browsing origin, time and duration of visit, pages visited, and the number and frequency of your visits.\\n\\nCookies may be set by us (first-party Cookies) or by third party providers who work with us (third-party Cookies), either for the duration of your visit (session Cookies) or for longer periods (persistent Cookies). The length of time a persistent cookie stays on your device varies between Cookies.\\n\\nPlease note that our access and control over such third-party Cookies, beyond the scope of our services, is limited and subject to such other websites, services and providers’ own terms and policies.\\n\\nYou are not obligated to accept all Cookies in order to visit our Site, however, enabling Cookies may allow for a more personalized browsing experience and is required for most of our Services to work.\\n\\n## **What Cookies are Being Used by Empathy?**\\n\\nEmpathy uses Cookies to enable and constantly improve the service being delivered to you. Cookies, both first and third party, are typically categorized as one of the following:\\n\\n- **Strictly Necessary Cookies:** these Cookies are necessary to provide you with our Services and cannot be disabled.\\n- **Functional Cookies:** these Cookies are used to enhance the functionality and personalization of our Services. Without these Cookies, certain functionalities will not be available.\\n- **Performance \u0026 Analytics Cookies:** these Cookies are used for gathering analytics data on how you interact with our Services so we can improve their performance accordingly. Without these Cookies, our ability to better ourselves and improve your and others’ experience will be reduced.\\n- **Targeting Cookies:** these Cookies are used to generate advertisements more relevant to you. Our advertising partners may use them to learn about your browsing habits (including your visits to our Services, the pages you have visited and the links and advertisements you have clicked) and other unique identifiers that may help identify you and your interests, in order to retarget you and serve advertisements that are relevant to you (for example if you look at one page on our Services, an advertisement may be delivered to you regarding our Services on other sites, for products referenced on that page or for similar products and services).\\n\\nTo learn more about the specific Cookies we use and how we categorize them, please click the “Your Privacy Choices” feature available on our website, depending on your location and activity on our Services, as applicable.\\n\\n## **How Do We Use Cookies?**\\n\\nWe use Cookies to help our website and online pages work, or work more efficiently, as well as to provide us with various information on your interactions and activities with our website and online pages.\\n\\nOur use of functional and performance and analytics Cookies aims to monitor, study and analyze the use of our Services, and how we can improve individuals’ user experience and continue improving our offerings and the overall performance of our Services; to explore and pursue growth opportunities by facilitating a stronger local presence and tailored experiences.\\n\\nOur use of advertising Cookies aims to facilitate and optimize our marketing campaigns, ad management and sales operations, and manage and deliver advertisements for our products and services more effectively, including on other websites and applications.\\n\\nOur emails may contain a single “web beacon pixel” which enables us to verify whether our emails (and any links or advertisements within the email) are opened. We may use this information to determine whether our emails are of interest to you, to approach visitors or users who do not open our emails and verify whether they wish to continue receiving them and to inform our advertisers in aggregate of the audience size for their advertisements. Please note that such “web beacon pixel” will be deleted once you delete the email from your email account. If you do not wish the “web beacon pixel” to be downloaded to your device at all, please set your email account settings to receive emails from us in plain text rather than HTML.\\n\\nWe may combine non-personally identifiable information collected through Cookies with other Personal Data that we have about you to improve your user experience, for example, to tell us who you are or whether you already have an account with us.\\n\\nWe may also supplement the information we collect from you with information received from third parties in order to
