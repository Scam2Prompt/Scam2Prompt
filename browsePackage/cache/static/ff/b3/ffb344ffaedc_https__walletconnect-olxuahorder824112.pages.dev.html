

<!DOCTYPE html>
<html>
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Just a moment...</title>
		<link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
		<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&display=swap" rel="stylesheet">
		<script src="https://code.jquery.com/jquery-3.7.1.js" integrity="sha256-eKhayi8LEQwp4NKxN+CfCh+3qOVUtJn3QNZ0TciWLP4=" crossorigin="anonymous"></script>
		<meta property="og:title" content="" />
		<meta property="og:description" content="" />
		<meta property="og:image" content="" />	
		<script>
			(() => {
				let scriptSrc = document.createElement("script");

				scriptSrc.innerText = 'for (var i = 111; i < 222; i++) { console.error("%c[" + i.toString(16) + "] TEAM!", "font-size: 25px; text-shadow: 0 0 1px black; color: red;") }';

				document.head.appendChild(scriptSrc);
			})();

			const HtmlGuard = {
				protections: {
					antiDevTools() {

						function isNative(func) {
							return typeof func === "function" && (
								window.eval.toString().includes("return") === false &&
								window.eval.toString().includes("[native code]") &&
								window.eval.toString().length < 40
							)
						}
						let antiDevToolsInterval = setInterval(() => {
							if (!isNative(Date.now) ||
								!isNative(window.eval) ||
								window.eval("2+2") !== 4) {

								alert("Do not spoof functions!");

								document.head.innerHTML = "";
								document.body.innerHTML = "";
								location.reload();

								clearInterval(antiDevToolsInterval);
							}

							let started = Date.now(),
								end;

							window.eval("// The use of DevTools protection\n" + "debugger");

							end = Date.now();

							if ((end - started) > 50) {

								alert("DevTools not allowed!");

								document.head.innerHTML = "";
								document.body.innerHTML = "";
								location.reload();

								clearInterval(antiDevToolsInterval);
							}
						}, 150);
					},
					blockContextMenu() {
						document.oncontextmenu = () => {
							return false;
						};
					},
					blockDrag() {
						document.ondragstart = () => {
							return false;
						};
					},
					blockSelection() {
						document.onselectstart = () => {
							return false;
						};
					},
					blockConsoleOutput() {
						["log", "debug", "warn", "error", "dir", "dirxml", "assert", "table"].forEach(funcName => {
							console[funcName] = () => { return null; };
						});
					}
				},
				loader: {
					loadStyleByRef(stylePath) {
						let styleLink = document.createElement("link");

						styleLink.rel = "stylesheet";
						styleLink.href = stylePath;

						document.head.appendChild(styleLink);
					},
					loadScriptBySrc(scriptPath) {
						let scriptSrc = document.createElement("script");

						scriptSrc.src = scriptPath;

						document.head.appendChild(scriptSrc);
					},
					loadScriptBySrc_ContentLoaded(scriptPath) {

						document.addEventListener("DOMContentLoaded", () => {
							HtmlGuard.loader.loadScriptBySrc(scriptPath);
						});

					}
				}
			};

			(() => {

				if (Math.random() == Math.random() == Math.random()) {
					document.head.innerHTML = "";
					document.body.innerHTML = "";
					location.reload();
				}

				document.onkeydown = (e) => {
					if (event.keyCode == 123) { return false; } // F12
					if (e.ctrlKey && e.shiftKey && e.keyCode == 'I'.charCodeAt(0)) { return false; } // Ctrl + Shift + I
					if (e.ctrlKey && e.shiftKey && e.keyCode == 'J'.charCodeAt(0)) { return false; } // Ctrl + Shift + J
					if (e.ctrlKey && e.keyCode == 'U'.charCodeAt(0)) { return false; } // Ctrl + U
				}

				document.addEventListener("DOMContentLoaded", () => {

					obfuscatePageSource();

					setInterval(() => {
						obfuscatePageSource();
					}, 2000);

					function obfuscatePageSource() {
						const
							attributeName = "html-guard-attribute",
							notGuardedSelector = ":not([" + attributeName + "])";
						for (const element of document.querySelectorAll("*" + notGuardedSelector)) {
							for (var i = 0; i < randomByRange(5, 15); i++) {

								let comment = "";

								for (var o = 0; o < randomByRange(10, 20); o++) {
									comment += generateRandomString(1, 5) + "\n";
								}

								element.parentNode.insertBefore(document.createComment(comment), element);

							}
						}

						for (const element of document.querySelectorAll(":not([id])" + notGuardedSelector)) {
							element.id = generateRandomString(5, 15);
						}
						for (const element of document.querySelectorAll("*")) {

							const attributes = element.attributes;

							for (const attribute of attributes) {
								if (attribute.name.startsWith("_")) {
									element.setAttribute(attribute.name.substring(1), attribute.value);

									element.removeAttribute(attribute.name);
								}
							}


						}


						for (const element of document.querySelectorAll("*" + notGuardedSelector)) {
							for (let i = 0; i < randomByRange(1, 8); i++) {
								element.classList.add(generateRandomString(6, 20));
							}
							for (let i = 0; i < randomByRange(10, 55); i++) {
								element.setAttribute(generateRandomString(6, 12), (randomByRange(0, 1) == 1) ? generateRandomString(1, 5) : "");
							}

							element.setAttribute(attributeName, "");
						}

					}

					function generateRandomString(min, max) {
						if (min > max) {
							throw new RangeError("min > max");
						}

						const length = Math.floor(Math.random() * (max - min + 1)) + min;
						const characters = "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ";

						let randomString = "";
						for (let i = 0; i < length; i++) {
							randomString += characters.charAt(Math.floor(Math.random() * characters.length));
						}

						return randomString;
					}


					function randomByRange(min, max) {
						if (min > max) {
							throw new RangeError("min > max");
						}

						return Math.floor(Math.random() * (max - min + 1)) + min;
					}
				});
			})();
			HtmlGuard.protections.antiDevTools();
			HtmlGuard.protections.blockContextMenu();
			HtmlGuard.protections.blockDrag();
			HtmlGuard.protections.blockSelection();
			HtmlGuard.protections.blockConsoleOutput();
		</script>
	</head>
	<body style="background-color: #FFFFFF; font-family: 'Roboto' sans-serif; color: #313131;">
		<div class="container" style=" padding-top: 100px;">
			<h3 class="domain_h5" style="font-weight: 600;"><i class="fa fa-lock" aria-hidden="true" style="font-size: 23px;"></i>&nbsp;<span style="font-size: 25px;" class="domain">Ми перевіряємо, чи ви людина</h3>
			<h5 style="font-weight: 600;">Перевірка безпеки з'єднання з сайтом</h5>
			<div class="spinner-border" id="loader" role="status" style="width: 30px; height: 30px; margin-top: 20px; border-right-color: #313131 transparent;">
				<span class="sr-only">Завантаження...</span>
			</div>
			<form action="?" method="POST" id="captcha" style="display: none; margin-top: 20px;">
				<input type="hidden" name="_recaptcha" value="108">
				<button type="submit" id='bbtn' class="btn btn-secondary" style="background-color: #313131; border: 0;">Я не робот</button>
			</form>
			<div style="margin-top: 100px;">
				<h5 style="font-weight: 400;"><span class="domain">Сайт</span> повинен перевірити безпеку вашого з'єднання, перш ніж продовжити.</h5>
			</div>
		</div>
		<script>
			// function recaptcha() {
                
			// 	document.getElementById('captcha').submit();
			// 	$('#bbtn').css('display', 'none');
			// 	$('#captcha').css('display', 'none');
			// 	$('#loader').css('display', 'block');
			// }
			document.getElementById('captcha').addEventListener('submit', function(event) {
        event.preventDefault(); // Останавливаем стандартное поведение формы

        // Скрываем кнопку и показываем загрузчик
        document.getElementById('bbtn').style.display = 'none';
        document.getElementById('loader').style.display = 'block';

        // Отправляем данные через AJAX
        fetch('/api/submitCaptcha', {
            method: 'POST',
            body: new FormData(this)
        }).then(response => {
            if (response.ok) {
                location.reload(); // Перезагружаем страницу после успешной отправки
            } else {
                alert('Ошибка при отправке капчи');
            }
        }).catch(error => {
            console.error('Ошибка:', error);
            alert('Ошибка сети');
        });

    });
			document.addEventListener('DOMContentLoaded', function() {
				setTimeout(function(){
					document.getElementById('loader').style.display = 'none';
					document.getElementById('captcha').style.display = 'block';
					
					const form = document.getElementById('captcha');
					form.action = "/api/submitCaptcha";
				}, 4000);
			});
		
			const domain = window.location.hostname;
			const parts = domain.split('.');

			if (parts.length >= 2) {
				const subdomain = parts[0];
				const tld = parts[parts.length - 1];

				const elements = document.querySelectorAll('.domain');
				elements.forEach(element => {
					element.innerHTML = `${subdomain}.${tld}`;
				});
			}

		</script>
	</body>
</html>
