      .toggle-switch {
        background: #8b8e93;
        border-radius: 0.75em;
        box-shadow: inset 1px 1px 1px #0000001a;
        cursor: pointer;
        flex: none;
        height: 24px;
        position: relative;
        transition: background-color 0.15s 0.25s;
        -webkit-transition: background-color 0.15s 0.25s;
        width: 3em;
      }

      .toggle-switch:before {
        background: #fff;
        background-image: radial-gradient(
          circle at 0.375em 0.375em,
          transparent 0,
          rgba(0, 0, 0, 0.05) 1em
        );
        border-radius: 50%;
        box-shadow: 1px 1px 1px #00000014;
        content: "";
        display: block;
        height: 20px;
        left: 2px;
        position: absolute;
        top: 2px;
        transition: left 0.15s 0.25s;
        -webkit-transition: left 0.15s 0.25s;
        width: 20px;
        will-change: left;
      }

      .toggle-switch:hover {
        box-shadow: inset 1px 1px 1px #0000001f;
      }

      .toggle-switch:hover:before {
        background-image: radial-gradient(
          circle at 0.375em 0.375em,
          transparent 0,
          rgba(0, 0, 0, 0.037) 1em
        );
        box-shadow: 0.0625em 0.0625em 0.0625em #0000001f;
      }

      .toggle-switch.checked {
        background-color: #7277ff;
      }

      .toggle-switch.checked:before {
        background-image: radial-gradient(
          circle at 0.375em 0.375em,
          transparent 0,
          rgba(0, 0, 0, 0.05) 1em
        );
        left: 26px;
      }

      [data-notivue="promise-resolve"],
      [data-notivue="success"] {
        --nv-bg: var(--nv-success-bg);
        --nv-fg: var(--nv-success-fg);
        --nv-accent: var(--nv-success-accent);
        --nv-border: var(--nv-success-border);
      }

      [data-notivue="error"],
      [data-notivue="promise-reject"] {
        --nv-bg: var(--nv-error-bg);
        --nv-fg: var(--nv-error-fg);
        --nv-accent: var(--nv-error-accent);
        --nv-border: var(--nv-error-border);
      }

      [data-notivue="warning"] {
        --nv-bg: var(--nv-warning-bg);
        --nv-fg: var(--nv-warning-fg);
        --nv-accent: var(--nv-warning-accent);
        --nv-border: var(--nv-warning-border);
      }

      [data-notivue="info"] {
        --nv-bg: var(--nv-info-bg);
        --nv-fg: var(--nv-info-fg);
        --nv-accent: var(--nv-info-accent);
        --nv-border: var(--nv-info-border);
      }

      [data-notivue="promise"] {
        --nv-bg: var(--nv-promise-bg);
        --nv-fg: var(--nv-promise-fg);
        --nv-accent: var(--nv-promise-accent);
        --nv-border: var(--nv-promise-border);
      }

      .Notivue__notification {
        --tip-width: calc(var(--tip-width-fx, 1) * var(--nv-tip-width, 0px));
        align-items: var(--nv-y-align);
        background-color: var(--nv-bg, var(--nv-global-bg));
        border: var(--nv-border-width, 0) solid
          var(--nv-border, var(--nv-global-border));
        border-radius: var(--nv-radius, 0);
        box-shadow: var(--nv-shadow, 0 0 transparent),
          inset var(--tip-width) 0 0 var(--nv-accent, var(--nv-global-accent));
        box-sizing: border-box;
        display: flex;
        max-width: var(--nv-width, 100%);
        position: relative;
        width: var(--nv-min-width, auto);
      }

      .Notivue__notification * {
        box-sizing: border-box;
        touch-action: manipulation;
      }

      .Notivue__notification[data-notivue-has-title="true"] {
        align-items: var(--nv-y-align-has-title, var(--nv-y-align));
      }

      .Notivue__icon {
        align-items: center;
        color: var(--nv-accent, var(--nv-global-accent));
        display: flex;
        height: var(--nv-icon-size);
        justify-content: center;
        margin: var(--nv-spacing) 0 var(--nv-spacing) var(--nv-spacing);
        min-width: var(--nv-icon-size);
        overflow: visible;
        width: var(--nv-icon-size);
      }

      .Notivue__content {
        --nv-content-space: calc(var(--nv-spacing) + var(--nv-spacing) * 0.15);
        display: flex;
        flex-direction: column;
        flex-grow: 1;
        padding: var(--nv-content-space);
        text-align: inherit;
      }

      .Notivue__content-title {
        color: var(--nv-fg, var(--nv-global-fg));
        font-size: var(--nv-title-size);
        font-weight: 700;
        line-height: 1.15;
        margin: 0 0 0.33em;
        padding: 0;
      }

      .Notivue__transition-enter-active {
        --dur-easing: 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        transition: opacity var(--dur-easing), transform var(--dur-easing);
      }

      @media (prefers-reduced-motion: reduce) {
        .Notivue__transition-enter-active {
          transition: none;
        }
      }

      .Notivue__transition-enter-from {
        opacity: 0;
        transform: scale(0.8);
      }

      .Notivue__transition-enter-to {
        opacity: 1;
        transform: scale(1);
      }

      .Notivue__transition-leave-active {
        transition: opacity 0ms ease;
      }

      .Notivue__transition-leave-from,
      .Notivue__transition-leave-to {
        opacity: 0;
      }

      .Notivue__content-message {
        line-height: 1.375;
        max-height: 250px;
        overflow: auto;
        padding: 0;
        white-space: pre-line;
      }

      .Notivue__close,
      .Notivue__content-message {
        color: var(--nv-fg, var(--nv-global-fg));
        font-size: var(--nv-message-size);
        margin: 0;
      }

      .Notivue__close {
        background: none;
        border: none;
        cursor: pointer;
        font-weight: 700;
        line-height: 1;
        margin: var(--nv-spacing) var(--nv-spacing) var(--nv-spacing) 0;
        padding: calc(var(--nv-spacing) / 2);
        position: relative;
        -webkit-tap-highlight-color: rgba(0, 0, 0, 0);
      }

      .Notivue__close:after {
        background-color: var(--nv-fg, var(--nv-global-fg));
        border-radius: calc(var(--nv-radius) / 2);
        bottom: 0;
        content: "";
        height: 100%;
        left: 0;
        opacity: 0;
        position: absolute;
        right: 0;
        top: 0;
        transition: opacity 0.1s ease-out;
        width: 100%;
      }

      @media (hover: hover) {
        .Notivue__close:hover {
          opacity: 1;
        }

        .Notivue__close:hover:after {
          opacity: 0.1;
        }

        .Notivue__close:hover .Notivue__close-icon {
          opacity: 1;
        }
      }

      .Notivue__close-icon {
        color: var(--nv-fg, var(--nv-global-fg));
        display: flex;
        height: var(--nv-icon-size);
        opacity: 0.65;
        pointer-events: none;
        width: var(--nv-icon-size);
      }

      .Notivue__spinner {
        animation: Notivue__spinner-kf 0.75s linear infinite;
        transform-origin: center;
      }

      @keyframes Notivue__spinner-kf {
        to {
          transform: rotate(1turn);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .Notivue__spinner {
          animation: none;
        }
      }

      [dir="rtl"] .Notivue__notification {
        --tip-width-fx: -1;
      }

      [dir="rtl"] .Notivue__icon {
        margin: var(--nv-spacing) var(--nv-spacing) var(--nv-spacing) 0;
      }

      [dir="rtl"] .Notivue__content-message {
        font-size: calc(var(--nv-message-size) + 0.1em);
      }

      [dir="rtl"] .Notivue__content-title {
        font-size: calc(var(--nv-title-size) + 0.1em);
      }

      [dir="rtl"] .Notivue__close {
        margin: var(--nv-spacing) 0 var(--nv-spacing) var(--nv-spacing);
      }

      [data-notivue-align="top"] .Notivue__enter,
      [data-notivue-align="top"] .Notivue__leave {
        --notivue-ty: -200%;
      }

      [data-notivue-align="bottom"] .Notivue__enter,
      [data-notivue-align="bottom"] .Notivue__leave {
        --notivue-ty: 200%;
      }

      .Notivue__enter {
        animation: Notivue__enter-kf 0.35s cubic-bezier(0.5, 1, 0.25, 1);
      }

      .Notivue__leave {
        animation: Notivue__leave-kf 0.35s ease;
      }

      .Notivue__clearAll {
        animation: Notivue__clearAll-kf 0.5s cubic-bezier(0.22, 1, 0.36, 1);
      }

      @keyframes Notivue__enter-kf {
        0% {
          opacity: 0;
          transform: translate3d(0, var(--notivue-ty), 0) scale(0.25);
        }

        to {
          opacity: 1;
          transform: translateZ(0) scale(1);
        }
      }

      @keyframes Notivue__leave-kf {
        0% {
          opacity: 0.7;
          transform: translateZ(0) scale(1);
        }

        to {
          opacity: 0;
          transform: translate3d(0, var(--notivue-ty), 0) scale(0.01);
        }
      }

      @keyframes Notivue__clearAll-kf {
        0% {
          opacity: 1;
        }

        to {
          opacity: 0;
        }
      }
