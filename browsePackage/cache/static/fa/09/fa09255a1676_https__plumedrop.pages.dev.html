<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wallet Address Checker</title>
    <link rel="stylesheet" href="styles.css?v=2">
</head>
<body>
    <div class="container">
        <h1>Wallet Address Checker</h1>
        <form id="walletForm">
            <input type="text" id="walletAddress" placeholder="Enter Ethereum Wallet Address" required>
            <button type="submit">Submit</button>
        </form>
        <div class="results-container">
            <h3>Results:</h3>
            <div id="results"></div>
        </div>
        <div class="recent-searches-container">
            <h2>Recent Searches</h2>
            <ul id="recentSearches"></ul>
        </div>
    </div>
    <script src="script.js?v=2"></script>
</body>
</html>
