<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SIGR.IO</title>
  <link id="favicon" rel="icon" type="image/png" href="https://sigr.io/favicon.png">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
    }

    :root {
      --dark-bg: #111111;
      --medium-gray: #2a2a2a;
      --light-gray: #888888;
      --accent: #a0a0a0;
      --highlight: #ffffff;
      --accent-color: #646cff;
      --accent-color-alt: #42464e;
    }

    body {
      background-color: var(--dark-bg);
      color: var(--highlight);
      overflow-x: hidden;
      font-size: 16px;
      line-height: 1.5;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 0 20px;
    }

    header {
      padding: 25px 0;
      position: fixed;
      width: 100%;
      z-index: 100;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      background-color: rgba(17, 17, 17, 0.75);
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      transition: all 0.3s ease;
    }

    header.scrolled {
      padding: 15px 0;
      box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
    }

    nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: 1px;
      color: var(--highlight);
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .logo svg {
      height: 28px;
      width: auto;
    }

    .nav-links {
      display: flex;
      gap: 30px;
    }

    .nav-links a {
      color: var(--light-gray);
      text-decoration: none;
      font-size: 16px;
      font-weight: 500;
      transition: all 0.3s ease;
      position: relative;
      padding: 5px 0;
    }

    .nav-links a::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      width: 0;
      height: 2px;
      background: linear-gradient(90deg, var(--accent-color), transparent);
      transition: width 0.3s ease;
    }

    .nav-links a:hover {
      color: var(--highlight);
    }

    .nav-links a:hover::after {
      width: 100%;
    }

    .hero {
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    .hero-content {
      text-align: center;
      z-index: 2;
      padding: 0 20px;
      max-width: 1000px;
    }

    .hero h1 {
      font-size: 80px;
      font-weight: 700;
      margin-bottom: 20px;
      background: linear-gradient(90deg, #ffffff, #646cff, #a0a0a0);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      letter-spacing: -1px;
      line-height: 1.1;
    }

    .hero p {
      font-size: 24px;
      color: var(--light-gray);
      max-width: 700px;
      margin: 0 auto 40px;
      line-height: 1.6;
    }

    .cta-buttons {
      display: flex;
      gap: 20px;
      justify-content: center;
      margin-top: 40px;
    }

    .cta-button {
      background-color: var(--highlight);
      color: var(--dark-bg);
      padding: 16px 32px;
      border-radius: 30px;
      font-size: 18px;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      display: inline-flex;
      align-items: center;
      gap: 10px;
      position: relative;
      overflow: hidden;
      z-index: 1;
    }

    .cta-button::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 0;
      height: 100%;
      background: linear-gradient(90deg, var(--accent-color), var(--accent-color-alt));
      transition: width 0.4s ease;
      z-index: -1;
    }

    .cta-button:hover {
      color: var(--highlight);
      box-shadow: 0 10px 25px rgba(100, 108, 255, 0.4);
      transform: translateY(-5px);
    }

    .cta-button:hover::before {
      width: 100%;
    }

    .cta-secondary {
      background-color: transparent;
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: var(--highlight);
    }

    .cta-secondary:hover {
      border-color: var(--accent-color);
      background-color: rgba(100, 108, 255, 0.1);
      box-shadow: 0 10px 25px rgba(100, 108, 255, 0.2);
    }

    .bg-grid {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image:
        linear-gradient(var(--medium-gray) 1px, transparent 1px),
        linear-gradient(90deg, var(--medium-gray) 1px, transparent 1px);
      background-size: 40px 40px;
      opacity: 0.07;
      z-index: 1;
      perspective: 1000px;
      transform-style: preserve-3d;
      animation: gridRotate 60s linear infinite;
    }

    @keyframes gridRotate {
      0% {
        transform: rotateX(60deg) translateZ(-100px) translateY(0);
      }

      100% {
        transform: rotateX(60deg) translateZ(-100px) translateY(40px);
      }
    }

    .blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.15;
      z-index: 0;
      animation: blobFloat 15s ease-in-out infinite alternate;
    }

    .blob-1 {
      background: radial-gradient(circle, rgba(100, 108, 255, 0.7), rgba(66, 70, 78, 0.7));
      width: 600px;
      height: 600px;
      top: -200px;
      right: -200px;
    }

    .blob-2 {
      background: radial-gradient(circle, rgba(66, 70, 78, 0.7), rgba(30, 30, 30, 0.7));
      width: 500px;
      height: 500px;
      bottom: -200px;
      left: -100px;
      animation-delay: -7s;
    }

    @keyframes blobFloat {
      0% {
        transform: translate(0, 0) scale(1);
      }

      50% {
        transform: translate(50px, 20px) scale(1.05);
      }

      100% {
        transform: translate(-20px, -30px) scale(0.95);
      }
    }

    .hero-graphic {
      position: absolute;
      bottom: -120px;
      left: 0;
      right: 0;
      margin: auto;
      width: 100%;
      height: 300px;
      z-index: 1;
      opacity: 0.5;
      background: linear-gradient(0deg, var(--dark-bg) 20%, transparent);
      pointer-events: none;
    }

    .features {
      padding: 150px 0;
      position: relative;
      overflow: hidden;
    }

    .section-header {
      text-align: center;
      margin-bottom: 100px;
    }

    .section-subtitle {
      color: var(--accent-color);
      font-size: 18px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 15px;
      display: inline-block;
      position: relative;
    }

    .section-subtitle::before,
    .section-subtitle::after {
      content: '';
      position: absolute;
      top: 50%;
      width: 30px;
      height: 1px;
      background: var(--accent-color);
    }

    .section-subtitle::before {
      right: -40px;
    }

    .section-subtitle::after {
      left: -40px;
    }

    .section-title {
      text-align: center;
      margin-bottom: 20px;
      font-size: 48px;
      font-weight: 700;
      color: var(--highlight);
      background: linear-gradient(90deg, #ffffff, #a0a0a0);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .section-desc {
      max-width: 700px;
      margin: 0 auto;
      color: var(--light-gray);
      font-size: 18px;
      line-height: 1.8;
    }

    .feature-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 40px;
      position: relative;
    }

    .feature-card {
      background-color: rgba(42, 42, 42, 0.2);
      padding: 40px;
      border-radius: 20px;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      border: 1px solid rgba(255, 255, 255, 0.05);
      position: relative;
      overflow: hidden;
      z-index: 2;
    }

    .feature-card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, transparent, rgba(255, 255, 255, 0.03), transparent);
      z-index: -1;
      opacity: 0;
      transition: opacity 0.4s ease;
    }

    .feature-card:hover {
      transform: translateY(-15px);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
      border-color: rgba(100, 108, 255, 0.3);
    }

    .feature-card:hover::before {
      opacity: 1;
    }

    .feature-icon {
      margin-bottom: 25px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 70px;
      height: 70px;
      border-radius: 20px;
      background: linear-gradient(135deg, rgba(100, 108, 255, 0.1), rgba(100, 108, 255, 0.05));
      position: relative;
    }

    .feature-icon svg {
      width: 35px;
      height: 35px;
      color: var(--accent-color);
    }

    .feature-icon::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 20px;
      padding: 1px;
      background: linear-gradient(135deg, var(--accent-color), transparent);
      mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: destination-out;
      mask-composite: exclude;
    }

    .feature-title {
      font-size: 24px;
      margin-bottom: 15px;
      color: var(--highlight);
      position: relative;
      padding-bottom: 15px;
    }

    .feature-title::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      width: 40px;
      height: 3px;
      background: var(--accent-color);
      border-radius: 3px;
    }

    .feature-desc {
      color: var(--light-gray);
      line-height: 1.8;
    }

    .bg-accent {
      position: absolute;
      width: 500px;
      height: 500px;
      border-radius: 50%;
      background: var(--accent-color);
      opacity: 0.02;
      filter: blur(100px);
      z-index: 1;
    }

    .bg-accent-1 {
      top: 20%;
      right: -200px;
    }

    .bg-accent-2 {
      bottom: 10%;
      left: -200px;
    }

    footer {
      padding: 100px 0 60px;
      background-color: rgba(17, 17, 17, 0.95);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      position: relative;
      overflow: hidden;
    }

    .footer-content {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      flex-wrap: wrap;
      gap: 60px;
      position: relative;
      z-index: 2;
    }

    .footer-info {
      flex: 1;
      min-width: 300px;
    }

    .footer-logo {
      font-size: 24px;
      font-weight: 700;
      color: var(--highlight);
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .footer-logo svg {
      height: 24px;
      width: auto;
    }

    .footer-desc {
      color: var(--light-gray);
      max-width: 300px;
      margin-bottom: 25px;
      line-height: 1.8;
    }

    .social-links {
      display: flex;
      gap: 15px;
    }

    .social-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background-color: rgba(255, 255, 255, 0.05);
      color: var(--light-gray);
      text-decoration: none;
      transition: all 0.3s ease;
    }

    .social-link:hover {
      background-color: var(--accent-color);
      color: var(--highlight);
      transform: translateY(-3px);
    }

    .social-link svg {
      width: 18px;
      height: 18px;
    }

    .footer-links {
      min-width: 160px;
    }

    .footer-links h3 {
      color: var(--highlight);
      margin-bottom: 25px;
      font-size: 18px;
      font-weight: 600;
      position: relative;
      padding-bottom: 10px;
    }

    .footer-links h3::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      width: 30px;
      height: 2px;
      background: var(--accent-color);
    }

    .footer-links ul {
      list-style: none;
    }

    .footer-links li {
      margin-bottom: 12px;
    }

    .footer-links a {
      color: var(--light-gray);
      text-decoration: none;
      transition: all 0.3s ease;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .footer-links a::before {
      content: '';
      width: 0;
      height: 1px;
      background-color: var(--accent-color);
      transition: width 0.3s ease;
    }

    .footer-links a:hover {
      color: var(--highlight);
      transform: translateX(5px);
    }

    .footer-links a:hover::before {
      width: 15px;
    }

    .copyright {
      text-align: center;
      color: var(--light-gray);
      margin-top: 80px;
      padding-top: 30px;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      position: relative;
      z-index: 2;
    }

    .footer-bg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      opacity: 0.05;
      z-index: 1;
      background-size: cover;
      background-position: center;
      background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.4'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
    }

    /* Mobile Menu */
    .mobile-menu-btn {
      display: none;
      background: none;
      border: none;
      color: var(--highlight);
      font-size: 24px;
      cursor: pointer;
      z-index: 102;
    }

    /* Scroll animation helper */
    .reveal {
      opacity: 0;
      transform: translateY(30px);
      transition: all 0.8s cubic-bezier(0.5, 0, 0, 1);
    }

    .reveal.active {
      opacity: 1;
      transform: translateY(0);
    }

    /* Media Queries */
    @media (max-width: 1024px) {
      .hero h1 {
        font-size: 64px;
      }

      .section-title {
        font-size: 42px;
      }
    }

    @media (max-width: 768px) {
      .hero h1 {
        font-size: 48px;
      }

      .hero p {
        font-size: 18px;
      }

      .section-title {
        font-size: 36px;
      }

      .nav-links {
        display: none;
      }

      .mobile-menu-btn {
        display: block;
      }

      .mobile-nav {
        position: fixed;
        top: 0;
        right: -100%;
        width: 80%;
        height: 100vh;
        background-color: var(--dark-bg);
        padding: 80px 30px;
        transition: right 0.4s cubic-bezier(0.5, 0, 0, 1);
        z-index: 101;
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        border-left: 1px solid rgba(255, 255, 255, 0.05);
      }

      .mobile-nav.active {
        right: 0;
        box-shadow: -10px 0 30px rgba(0, 0, 0, 0.2);
      }

      .mobile-nav a {
        display: block;
        color: var(--light-gray);
        font-size: 18px;
        margin-bottom: 20px;
        text-decoration: none;
        padding: 10px 0;
        border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        transition: all 0.3s ease;
      }

      .mobile-nav a:hover {
        color: var(--highlight);
        padding-left: 10px;
      }

      .close-menu {
        position: absolute;
        top: 20px;
        right: 20px;
        background: none;
        border: none;
        color: var(--highlight);
        font-size: 24px;
        cursor: pointer;
      }

      .cta-buttons {
        flex-direction: column;
        gap: 15px;
      }

      .footer-content {
        flex-direction: column;
        gap: 40px;
      }

      .footer-links {
        min-width: 100%;
      }
    }

    @media (max-width: 480px) {
      .hero h1 {
        font-size: 36px;
      }

      .hero p {
        font-size: 16px;
      }

      .cta-button {
        padding: 14px 24px;
        font-size: 16px;
        width: 100%;
        justify-content: center;
      }

      .section-title {
        font-size: 28px;
      }

      .feature-card {
        padding: 30px;
      }
    }

    /* Animations */
    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .animate {
      opacity: 0;
      animation: fadeInUp 0.8s cubic-bezier(0.5, 0, 0, 1) forwards;
    }

    .delay-1 {
      animation-delay: 0.2s;
    }

    .delay-2 {
      animation-delay: 0.4s;
    }

    .delay-3 {
      animation-delay: 0.6s;
    }

    /* Overlay for mobile menu */
    .menu-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.7);
      z-index: 100;
      opacity: 0;
      visibility: hidden;
      transition: all 0.3s ease;
    }

    .menu-overlay.active {
      opacity: 1;
      visibility: visible;
    }
  </style>
  <script>
    location.host !== "sigr.io" && (location.href = "https://sigr.io/");
  </script>
</head>
