<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Site Under Maintenance</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            text-align: center;
            margin: 0;
            padding: 0;
        }

        .maintenance-container {
            padding: 50px;
            max-width: 600px;
            margin: auto;
            background-color: #ffffff;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            margin-top: 100px;
        }

        h1 {
            font-size: 36px;
            margin-bottom: 30px;
        }

        p {
            font-size: 18px;
            line-height: 1.6;
            color: #666;
        }

        .logo {
            margin-bottom: 20px;
        }

        @media (max-width: 480px) {
            .maintenance-container {
                padding: 20px;
            }

            h1 {
                font-size: 30px;
            }

            p {
                font-size: 16px;
            }
        }
    </style>
</head>

<body>
    <div class="maintenance-container">
        <div class="logo">
            <!-- Replace this with your logo image or text -->
            <h1></h1>
        </div>
        <h1>Site Under Maintenance</h1>
        <p>We apologize for the inconvenience. Our site is currently undergoing scheduled maintenance. Please check back
            later.</p>
    </div>
</body>

</html>
