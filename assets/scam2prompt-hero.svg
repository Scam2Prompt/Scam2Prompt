<svg width="1280" height="420" viewBox="0 0 1280 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Scam2Prompt hero</title>
  <desc id="desc">A research artifact banner showing scam endpoints becoming prompts, generated code, and safety evidence.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#07111F"/>
      <stop offset="0.5" stop-color="#10233A"/>
      <stop offset="1" stop-color="#0B3B3A"/>
    </linearGradient>
    <linearGradient id="accent" x1="170" y1="60" x2="1120" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38BDF8"/>
      <stop offset="0.55" stop-color="#34D399"/>
      <stop offset="1" stop-color="#F43F5E"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-30%" width="140%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#020617" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="1280" height="420" rx="34" fill="url(#bg)"/>
  <path d="M80 315C232 174 340 202 470 120C585 47 698 58 820 126C954 201 1038 178 1200 77" stroke="url(#accent)" stroke-width="4" stroke-linecap="round" opacity="0.5"/>
  <path d="M102 350C254 236 360 251 490 185C625 116 736 128 866 198C992 266 1074 250 1188 164" stroke="#64748B" stroke-width="2" stroke-linecap="round" opacity="0.35"/>

  <g filter="url(#softShadow)">
    <rect x="78" y="74" width="258" height="206" rx="24" fill="#0F172A" stroke="#334155" stroke-width="2"/>
    <rect x="470" y="54" width="340" height="250" rx="28" fill="#07111F" stroke="#38BDF8" stroke-width="2"/>
    <rect x="944" y="86" width="258" height="206" rx="24" fill="#111827" stroke="#334155" stroke-width="2"/>
  </g>

  <text x="112" y="121" fill="#E2E8F0" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700">Scam endpoints</text>
  <rect x="110" y="148" width="178" height="18" rx="9" fill="#1E293B"/>
  <rect x="110" y="180" width="150" height="18" rx="9" fill="#1E293B"/>
  <rect x="110" y="212" width="198" height="18" rx="9" fill="#1E293B"/>
  <circle cx="289" cy="157" r="7" fill="#F43F5E"/>
  <circle cx="261" cy="189" r="7" fill="#F43F5E"/>
  <circle cx="309" cy="221" r="7" fill="#F43F5E"/>
  <text x="112" y="258" fill="#94A3B8" font-family="Arial, Helvetica, sans-serif" font-size="15">Known malicious infrastructure</text>

  <text x="640" y="122" text-anchor="middle" fill="#F8FAFC" font-family="Arial, Helvetica, sans-serif" font-size="58" font-weight="800">Scam2Prompt</text>
  <text x="640" y="163" text-anchor="middle" fill="#BAE6FD" font-family="Arial, Helvetica, sans-serif" font-size="22">Auditing malicious URL reproduction in production LLMs</text>
  <rect x="526" y="198" width="228" height="52" rx="16" fill="#0B3B3A" stroke="#34D399" stroke-width="2"/>
  <path d="M560 224H595M560 224L576 208M560 224L576 240" stroke="#A7F3D0" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="620" y="232" fill="#D1FAE5" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700">Prompt package</text>
  <text x="640" y="282" text-anchor="middle" fill="#94A3B8" font-family="Arial, Helvetica, sans-serif" font-size="16">prompts, generated code, oracle labels, tables, and benchmark scripts</text>

  <text x="982" y="132" fill="#E2E8F0" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700">Generated code</text>
  <path d="M984 168L1014 198L984 228" stroke="#A7F3D0" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M1030 228H1122" stroke="#38BDF8" stroke-width="8" stroke-linecap="round"/>
  <rect x="982" y="250" width="152" height="16" rx="8" fill="#1E293B"/>
  <circle cx="1148" cy="258" r="8" fill="#34D399"/>

  <path d="M354 180H450" stroke="#38BDF8" stroke-width="5" stroke-linecap="round"/>
  <path d="M434 162L454 180L434 198" stroke="#38BDF8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M828 180H924" stroke="#34D399" stroke-width="5" stroke-linecap="round"/>
  <path d="M908 162L928 180L908 198" stroke="#34D399" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
