<svg width="1280" height="360" viewBox="0 0 1280 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Scam2Prompt teaser</title>
  <desc id="desc">Three panels summarizing prompt synthesis, LLM testing, and table reproduction.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="1280" height="360" rx="28" fill="#F8FAFC"/>
  <text x="640" y="56" text-anchor="middle" fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="800">From scam infrastructure to reproducible LLM security evidence</text>
  <g filter="url(#shadow)">
    <rect x="70" y="92" width="340" height="198" rx="18" fill="#0F172A"/>
    <rect x="470" y="92" width="340" height="198" rx="18" fill="#0369A1"/>
    <rect x="870" y="92" width="340" height="198" rx="18" fill="#0F766E"/>
  </g>
  <text x="110" y="135" fill="#E2E8F0" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">1. Prompt synthesis</text>
  <text x="110" y="170" fill="#CBD5E1" font-family="Arial, Helvetica, sans-serif" font-size="16">Cached webpage text is converted into</text>
  <text x="110" y="196" fill="#CBD5E1" font-family="Arial, Helvetica, sans-serif" font-size="16">ordinary developer-style coding requests.</text>
  <rect x="110" y="226" width="228" height="18" rx="9" fill="#334155"/>
  <rect x="110" y="252" width="178" height="18" rx="9" fill="#334155"/>

  <text x="510" y="135" fill="#E0F2FE" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">2. LLM testing</text>
  <text x="510" y="170" fill="#BAE6FD" font-family="Arial, Helvetica, sans-serif" font-size="16">Production models generate code from the</text>
  <text x="510" y="196" fill="#BAE6FD" font-family="Arial, Helvetica, sans-serif" font-size="16">prompt package under deterministic settings.</text>
  <path d="M524 246L548 222L572 246M548 223V272" stroke="#A7F3D0" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M598 272H720" stroke="#E0F2FE" stroke-width="8" stroke-linecap="round"/>

  <text x="910" y="135" fill="#CCFBF1" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">3. Artifact tables</text>
  <text x="910" y="170" fill="#99F6E4" font-family="Arial, Helvetica, sans-serif" font-size="16">Oracle labels and compact result records</text>
  <text x="910" y="196" fill="#99F6E4" font-family="Arial, Helvetica, sans-serif" font-size="16">reproduce the paper tables cell by cell.</text>
  <rect x="912" y="224" width="246" height="48" rx="8" fill="#134E4A"/>
  <path d="M932 240H1138M932 256H1138M990 224V272M1060 224V272" stroke="#5EEAD4" stroke-width="2"/>
</svg>
