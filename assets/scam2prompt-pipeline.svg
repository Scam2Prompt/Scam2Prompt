<svg width="1100" height="260" viewBox="0 0 1100 260" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Scam2Prompt pipeline</title>
  <desc id="desc">Pipeline from scam databases to prompts, generated code, oracle validation, and reports.</desc>
  <rect width="1100" height="260" rx="20" fill="#F8FAFC"/>
  <defs>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>
  <g filter="url(#shadow)">
    <rect x="34" y="66" width="170" height="118" rx="14" fill="#0F172A"/>
    <rect x="250" y="66" width="170" height="118" rx="14" fill="#0369A1"/>
    <rect x="466" y="66" width="170" height="118" rx="14" fill="#0F766E"/>
    <rect x="682" y="66" width="170" height="118" rx="14" fill="#4338CA"/>
    <rect x="898" y="66" width="170" height="118" rx="14" fill="#BE123C"/>
  </g>
  <text x="119" y="105" text-anchor="middle" fill="#E2E8F0" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">Scam Seeds</text>
  <text x="119" y="134" text-anchor="middle" fill="#CBD5E1" font-family="Arial, Helvetica, sans-serif" font-size="14">known URLs</text>
  <text x="119" y="156" text-anchor="middle" fill="#CBD5E1" font-family="Arial, Helvetica, sans-serif" font-size="14">and domains</text>
  <text x="335" y="105" text-anchor="middle" fill="#E0F2FE" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">Prompt Synthesis</text>
  <text x="335" y="134" text-anchor="middle" fill="#BAE6FD" font-family="Arial, Helvetica, sans-serif" font-size="14">developer-style</text>
  <text x="335" y="156" text-anchor="middle" fill="#BAE6FD" font-family="Arial, Helvetica, sans-serif" font-size="14">coding tasks</text>
  <text x="551" y="105" text-anchor="middle" fill="#CCFBF1" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">Code Generation</text>
  <text x="551" y="134" text-anchor="middle" fill="#99F6E4" font-family="Arial, Helvetica, sans-serif" font-size="14">production</text>
  <text x="551" y="156" text-anchor="middle" fill="#99F6E4" font-family="Arial, Helvetica, sans-serif" font-size="14">LLMs</text>
  <text x="767" y="105" text-anchor="middle" fill="#E0E7FF" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">URL Oracle</text>
  <text x="767" y="134" text-anchor="middle" fill="#C7D2FE" font-family="Arial, Helvetica, sans-serif" font-size="14">extract and</text>
  <text x="767" y="156" text-anchor="middle" fill="#C7D2FE" font-family="Arial, Helvetica, sans-serif" font-size="14">validate URLs</text>
  <text x="983" y="105" text-anchor="middle" fill="#FFE4E6" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">Reports</text>
  <text x="983" y="134" text-anchor="middle" fill="#FECDD3" font-family="Arial, Helvetica, sans-serif" font-size="14">analysis and</text>
  <text x="983" y="156" text-anchor="middle" fill="#FECDD3" font-family="Arial, Helvetica, sans-serif" font-size="14">benchmarking</text>
  <path d="M210 125H240" stroke="#64748B" stroke-width="4" stroke-linecap="round"/>
  <path d="M234 116L244 125L234 134" stroke="#64748B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M426 125H456" stroke="#64748B" stroke-width="4" stroke-linecap="round"/>
  <path d="M450 116L460 125L450 134" stroke="#64748B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M642 125H672" stroke="#64748B" stroke-width="4" stroke-linecap="round"/>
  <path d="M666 116L676 125L666 134" stroke="#64748B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M858 125H888" stroke="#64748B" stroke-width="4" stroke-linecap="round"/>
  <path d="M882 116L892 125L882 134" stroke="#64748B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="550" y="225" text-anchor="middle" fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="16">Audit malicious URL reproduction in generated code, then package prompts and results for reproducible evaluation.</text>
